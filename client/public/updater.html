<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Zvon Updater</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1f22;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }

        .container {
            text-align: center;
            padding: 40px;
            width: 100%;
        }

        .z-loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            position: relative;
            transform-style: preserve-3d;
            perspective: 500px;
        }

        .bar {
            position: absolute;
            height: 8px;
            background: #5865f2;
            border-radius: 4px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
        }

        .bar.top {
            width: 50px;
            top: 20px;
            left: 15px;
            animation: topBarAnim 4s infinite;
        }

        .bar.middle {
            width: 60px;
            top: 36px;
            left: 10px;
            transform-origin: center;
            animation: middleBarAnim 4s infinite;
        }

        .bar.bottom {
            width: 50px;
            bottom: 20px;
            left: 15px;
            animation: bottomBarAnim 4s infinite;
        }

        @keyframes topBarAnim {

            0%,
            10% {
                transform: translateY(0) rotate(0);
            }

            20%,
            30% {
                transform: translateY(16px) rotate(0);
            }

            70%,
            80% {
                transform: translateY(16px) rotate(0);
            }

            90%,
            100% {
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes bottomBarAnim {

            0%,
            10% {
                transform: translateY(0) rotate(0);
            }

            20%,
            30% {
                transform: translateY(-16px) rotate(0);
            }

            70%,
            80% {
                transform: translateY(-16px) rotate(0);
            }

            90%,
            100% {
                transform: translateY(0) rotate(0);
            }
        }

        @keyframes middleBarAnim {

            0%,
            10% {
                transform: rotate(-45deg);
            }

            20%,
            30% {
                transform: rotate(0deg);
            }

            35%,
            65% {
                transform: rotate(0deg) rotateY(360deg);
            }

            70%,
            80% {
                transform: rotate(0deg);
            }

            90%,
            100% {
                transform: rotate(-45deg);
            }
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px;
            font-weight: 600;
            color: #ffffff;
        }

        .status {
            font-size: 14px;
            color: #b5bac1;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #2b2d31;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #5865f2;
            transition: width 0.3s ease;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: ' .';
            }

            40% {
                content: ' . .';
            }

            60% {
                content: ' . . .';
            }

            80%,
            100% {
                content: ' . . . .';
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="z-loader">
            <div class="bar top"></div>
            <div class="bar middle"></div>
            <div class="bar bottom"></div>
        </div>
        <h1>Zvon</h1>
        <div id="status" class="status">Проверка обновлений<span class="loading-dots"></span></div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const statusElement = document.getElementById('status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        ipcRenderer.on('updater-message', (event, text) => {
            statusElement.innerText = text;
        });

        ipcRenderer.on('updater-progress', (event, percent) => {
            progressContainer.style.display = 'block';
            progressBar.style.width = percent + '%';
            statusElement.innerText = `Загрузка обновления: ${Math.round(percent)}%`;
        });
    </script>
</body>

</html>
