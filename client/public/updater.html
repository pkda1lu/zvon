<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Zvon Updater</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1f22;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }

        .container {
            text-align: center;
            padding: 40px;
            width: 100%;
        }

        .z-loader {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .z-svg {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 12px rgba(88, 101, 242, 0.6));
            animation: zFloat 3s ease-in-out infinite;
        }

        .z-path {
            fill: none;
            stroke: #5865f2;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            animation: zDraw 2.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .z-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: zPulse 2s ease-in-out infinite;
        }

        @keyframes zDraw {
            0% {
                stroke-dashoffset: 300;
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            50% {
                stroke-dashoffset: 0;
            }

            80% {
                opacity: 1;
            }

            100% {
                stroke-dashoffset: -300;
                opacity: 0;
            }
        }

        @keyframes zPulse {

            0%,
            100% {
                transform: scale(0.8);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.6;
            }
        }

        @keyframes zFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px;
            font-weight: 600;
            color: #ffffff;
        }

        .status {
            font-size: 14px;
            color: #b5bac1;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #2b2d31;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #5865f2;
            transition: width 0.3s ease;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: ' .';
            }

            40% {
                content: ' . .';
            }

            60% {
                content: ' . . .';
            }

            80%,
            100% {
                content: ' . . . .';
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="z-loader">
            <div class="z-glow"></div>
            <svg class="z-svg" viewBox="0 0 100 100">
                <path class="z-path" d="M20,20 L80,20 L20,80 L80,80" />
            </svg>
        </div>
        <h1>Zvon</h1>
        <div id="status" class="status">Проверка обновлений<span class="loading-dots"></span></div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const statusElement = document.getElementById('status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        ipcRenderer.on('updater-message', (event, text) => {
            statusElement.innerText = text;
        });

        ipcRenderer.on('updater-progress', (event, percent) => {
            progressContainer.style.display = 'block';
            progressBar.style.width = percent + '%';
            statusElement.innerText = `Загрузка обновления: ${Math.round(percent)}%`;
        });
    </script>
</body>

</html>
