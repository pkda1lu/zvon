<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zvon Updater</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1f22;
            color: #dbdee1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }

        .container {
            text-align: center;
            padding: 40px;
            width: 100%;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #5865f2;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        .logo svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 10px;
            font-weight: 600;
            color: #ffffff;
        }

        .status {
            font-size: 14px;
            color: #b5bac1;
            margin-bottom: 25px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #2b2d31;
            border-radius: 3px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #5865f2;
            transition: width 0.3s ease;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80%, 100% { content: ' . . . .'; }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 4px 25px rgba(88, 101, 242, 0.6); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5l-3.5-3.5 1.41-1.41L11 13.67l4.59-4.59L17 10.5 11 16.5z"/>
            </svg>
        </div>
        <h1>Zvon</h1>
        <div id="status" class="status">Проверка обновлений<span class="loading-dots"></span></div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const statusElement = document.getElementById('status');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        ipcRenderer.on('updater-message', (event, text) => {
            statusElement.innerText = text;
        });

        ipcRenderer.on('updater-progress', (event, percent) => {
            progressContainer.style.display = 'block';
            progressBar.style.width = percent + '%';
            statusElement.innerText = `Загрузка обновления: ${Math.round(percent)}%`;
        });
    </script>
</body>
</html>
