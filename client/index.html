<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- maxcord.fun is an icon-only co-brand: redirect to the shared zvonserver.ru
         deployment, carrying a ?brand=maxcord marker so only the icons/favicon stay
         MAXCORD while everything else (name, logo, data, emails) is common. Runs as
         early as possible to avoid a flash of the wrong content. No-op everywhere else. -->
    <script>
        (function () {
            try {
                if (location.hostname.indexOf('maxcord.fun') !== -1) {
                    var u = new URL(location.href);
                    u.protocol = 'https:';
                    u.hostname = 'zvonserver.ru';
                    u.port = '';
                    u.searchParams.set('brand', 'maxcord');
                    location.replace(u.toString());
                }
            } catch (e) { }
        })();
    </script>
    <meta name="theme-color" content="#313338" />
    <meta name="description" content="Zvon - Real-time communication platform" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.youtube.com https://www.youtube-nocookie.com https://s.ytimg.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https: file: zvon:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://r2cdn.perplexity.ai; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: http: https: blob: file: zvon:; media-src 'self' blob: https:;">
    <link rel="icon" href="/icon.png" />
    <title>Zvon</title>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
