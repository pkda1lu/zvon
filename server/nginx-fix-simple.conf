# Простое решение для CORS - добавьте это в начало блока server
# Это обработает OPTIONS запросы ДО любых редиректов

server {
    listen 80;
    server_name zvon.duckdns.com;

    # ВАЖНО: Обработать OPTIONS запросы ПЕРВЫМ делом, до любых редиректов
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        add_header 'Content-Length' '0';
        add_header 'Content-Type' 'text/plain';
        return 204;
    }

    # Редирект HTTP -> HTTPS (если используете HTTPS)
    # return 301 https://$server_name$request_uri;

    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        
        # CORS headers для обычных запросов
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
    }

    location /api/uploads {
        alias /var/www/zvon/server/uploads;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Если используете HTTPS, добавьте аналогичный блок для порта 443
server {
    listen 443 ssl http2;
    server_name zvon.duckdns.com;

    ssl_certificate /etc/letsencrypt/live/zvon.duckdns.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvon.duckdns.com/privkey.pem;

    # ВАЖНО: Обработать OPTIONS запросы ПЕРВЫМ делом
    if ($request_method = 'OPTIONS') {
