# Конфигурация Nginx для serverzvon.duckdns.org
# Файл: /etc/nginx/sites-available/serverzvon

# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    server_name serverzvon.duckdns.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name serverzvon.duckdns.org;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/serverzvon.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serverzvon.duckdns.org/privkey.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Увеличение размера загружаемых файлов
    client_max_body_size 50M;
    proxy_read_timeout 86400s;
    proxy_connect_timeout 86400s;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API endpoints с CORS
    location ^~ /api/ {
        # Preflight OPTIONS
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $http_origin always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age           86400 always;
            add_header Content-Type   "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        # Proxy к backend
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $server_name;

        # Убираем CORS от backend, чтобы не было дублей
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # CORS от nginx
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers    "Content-Length" always;
    }

    # Статика uploads
    location /api/uploads/ {
        alias /var/www/zvon/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        autoindex off;
        try_files $uri $uri/ =404;
        
        # CORS для статических файлов
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # Fallback для всего остального
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Логирование
    access_log /var/log/nginx/serverzvon.access.log;
    error_log  /var/log/nginx/serverzvon.error.log;
}

