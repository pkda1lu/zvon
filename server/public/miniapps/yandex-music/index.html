<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Яндекс Музыка — Zvon</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="/zvon-sdk.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm-1-13v4.27a3 3 0 1 0 2 2.83V9h3V7z"/></svg>
        <span>Яндекс Музыка</span>
      </div>
      <div id="account" class="account"></div>
    </header>

    <main id="main" class="main"></main>

    <footer id="player" class="player hidden">
      <div class="player-cover" id="player-cover"></div>
      <div class="player-info">
        <div class="player-title" id="player-title">—</div>
        <div class="player-artist" id="player-artist">—</div>
        <div class="player-progress">
          <div class="player-time" id="player-elapsed">0:00</div>
          <div class="player-bar"><div id="player-bar-fill"></div></div>
          <div class="player-time" id="player-duration">0:00</div>
        </div>
      </div>
      <div class="player-controls">
        <button id="btn-prev" title="Предыдущий">⏮</button>
        <button id="btn-play" title="Пауза/Старт">⏸</button>
        <button id="btn-next" title="Следующий">⏭</button>
        <button id="btn-stop" title="Стоп" class="danger">⏹</button>
        <input type="range" id="vol" min="0" max="100" value="80" />
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
