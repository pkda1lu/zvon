<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Яндекс Музыка — Zvon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <script src="/zvon-sdk.js"></script>
</head>
<body>
  <div id="app" class="yandex-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="#ffd200" stroke-width="2.5" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" fill="#ffd200"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span class="brand-text"><span class="white">Yandex</span> <span class="yellow">Music</span></span>
      </div>

      <nav class="nav-menu">
        <button id="nav-search" class="nav-item">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Поиск</span>
        </button>
        <button id="nav-wave" class="nav-item active">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5v14M22 9v6M7 6v12M2 10v4"/></svg>
          <span>Моя волна</span>
        </button>
        <button id="nav-collection" class="nav-item">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Коллекция</span>
        </button>
        <button id="nav-queue" class="nav-item">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          <span>Очередь</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div id="account" class="account"></div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="content-wrapper">
      <header class="topbar">
        <div id="search-bar-host"></div>
      </header>

      <main id="main" class="main"></main>
    </div>

    <!-- Bottom Player -->
    <footer id="player" class="player hidden">
      <!-- Thin progress bar spanning full player width at top -->
      <div class="player-progress-container">
        <div class="player-bar" id="player-bar">
          <div id="player-bar-fill"></div>
        </div>
      </div>

      <div class="player-left">
        <div class="player-cover-wrapper">
          <div class="player-cover" id="player-cover"></div>
          <button id="btn-show-lyrics" class="lyrics-btn-overlay" title="Открыть текст">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          </button>
        </div>
        <div class="player-info">
          <div class="player-title-row">
            <div class="player-title" id="player-title">—</div>
          </div>
          <div class="player-artist" id="player-artist">—</div>
        </div>
        <div class="player-time-display">
          <span id="player-elapsed">0:00</span> / <span id="player-duration">0:00</span>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="btn-shuffle" title="Перемешать">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button id="btn-prev" title="Предыдущий">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="btn-play" class="play-btn" title="Воспроизведение/Пауза">
            <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="btn-next" title="Следующий">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button id="btn-stop" class="danger" title="Стоп">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
          </button>
        </div>
      </div>

      <div class="player-right">
        <div class="player-volume">
          <button id="btn-mute" class="volume-btn" title="Громкость">
            <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          </button>
          <div class="vol-slider-container">
            <input type="range" id="vol" min="0" max="100" value="80" />
          </div>
        </div>
      </div>
    </footer>

    <!-- Fullscreen Lyrics / Player Overlay -->
    <div id="lyrics-overlay" class="lyrics-overlay hidden">
      <button id="btn-close-lyrics" class="close-lyrics-btn" title="Закрыть">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="lyrics-container">
        <!-- Left Side: Cover, Title, Play controls inside cover overlay -->
        <div class="lyrics-left-pane">
          <div class="lyrics-cover-wrapper">
            <div id="lyrics-cover" class="lyrics-cover"></div>
            <!-- Fullscreen controls styled overlay on top of the cover -->
            <div class="lyrics-cover-controls">
              <button id="lyrics-btn-prev" class="lyrics-ctrl-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button id="lyrics-btn-play" class="lyrics-ctrl-btn play">
                <svg id="lyrics-play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button id="lyrics-btn-next" class="lyrics-ctrl-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
              </button>
            </div>
          </div>
          
          <div class="lyrics-track-info">
            <div id="lyrics-title" class="lyrics-track-title">—</div>
            <div id="lyrics-artist" class="lyrics-track-artist">—</div>
          </div>

          <div class="lyrics-progress-area">
            <div class="lyrics-time" id="lyrics-elapsed">0:00</div>
            <div class="lyrics-bar-host" id="lyrics-progress-bar"><div id="lyrics-bar-fill"></div></div>
            <div class="lyrics-time" id="lyrics-duration">0:00</div>
          </div>

          <div class="lyrics-action-buttons">
            <button id="lyrics-btn-like" class="lyrics-act-btn" title="Нравится">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
            <button id="lyrics-btn-dislike" class="lyrics-act-btn" title="Не рекомендовать">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 6 0v-4M4 10h16M21 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </button>
          </div>
        </div>

        <!-- Right Side: Lyrics text scrollable container -->
        <div class="lyrics-right-pane">
          <div id="lyrics-text-container" class="lyrics-text-container">
            <div class="lyrics-placeholder">Инструментальная композиция или текст отсутствует</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
