<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Яндекс Музыка — Zvon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <script src="/zvon-sdk.js"></script>
</head>
<body>
  <div id="app">
    <div class="app-body">
      <!-- Левый сайдбар (как в оригинале) -->
      <aside class="sidebar">
        <div class="side-logo">
          <svg class="logo-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.35 6.9 6.9-2.6-4.3 5.95L24 12l-6.9 1.75 4.3 5.95-6.9-2.6L12 24l-2.35-6.9-6.9 2.6 4.3-5.95L0 12l6.9-1.75-4.3-5.95 6.9 2.6z"/></svg>
          <div class="wm"><span class="y">Yandex</span><span class="m">Music</span></div>
          <button class="side-collapse" id="side-collapse" title="Свернуть">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
        </div>

        <nav class="side-nav">
          <button class="nav-item" id="nav-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search</span>
          </button>
          <button class="nav-item" id="nav-vibe">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l1.8 5.3 5.3 1.8-5.3 1.8L12 15.7l-1.8-5.3L4.9 8.6l5.3-1.8z"/><circle cx="19" cy="18" r="1.6"/><circle cx="5.5" cy="17" r="1.1"/></svg>
            <span>My Vibe</span>
          </button>
          <button class="nav-item" id="nav-foryou">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span>For you and Trends</span>
          </button>
          <button class="nav-item" id="nav-concerts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-4z"/><line x1="9" y1="6" x2="9" y2="18"/></svg>
            <span>Concerts</span>
          </button>
          <button class="nav-item" id="nav-books">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><line x1="9" y1="7" x2="15" y2="7"/></svg>
            <span>Books &amp; Podcasts</span>
          </button>
          <button class="nav-item" id="nav-kids">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0"/><line x1="9" y1="9.5" x2="9" y2="10"/><line x1="15" y1="9.5" x2="15" y2="10"/></svg>
            <span>For Kids</span>
          </button>
          <button class="nav-item" id="nav-collection">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9A5.4 5.4 0 0 1 12 6.2 5.4 5.4 0 0 1 22 12c-2.5 4.4-10 9-10 9z"/></svg>
            <span>My Collection</span>
          </button>
        </nav>

        <div class="side-playlists" id="side-playlists"></div>
        <div id="account" class="account"></div>
      </aside>

      <!-- Контент -->
      <div class="content">
        <div id="search-bar-host"></div>
        <main id="main" class="main"></main>
      </div>
    </div>

    <!-- Нижний плеер -->
    <footer id="player" class="player hidden">
      <div class="player-cover" id="player-cover"></div>
      <div class="player-info">
        <div class="player-title" id="player-title">—</div>
        <div class="player-artist" id="player-artist">—</div>
        <div class="player-progress">
          <div class="player-time" id="player-elapsed">0:00</div>
          <div class="player-bar" id="player-bar"><div id="player-bar-fill"></div></div>
          <div class="player-time" id="player-duration">0:00</div>
        </div>
      </div>
      <div class="player-controls">
        <button id="btn-shuffle" title="Перемешать очередь">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button id="btn-prev" title="Предыдущий">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="btn-play" class="play-btn" title="Пауза/Старт">
          <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
        </button>
        <button id="btn-next" title="Следующий">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <button id="btn-stop" class="danger" title="Стоп">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <div class="player-volume">
          <svg id="vol-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <input type="range" id="vol" min="0" max="100" value="80" />
        </div>
      </div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
