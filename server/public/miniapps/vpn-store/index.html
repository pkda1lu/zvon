<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Магазин Zvon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/zvon-sdk.js"></script>
<style>
/* Визуальный язык — брутальная «комиксная» печать: плашечный чёрный,
 * бумажный светлый, кроваво-красный акцент, жёсткие рамки без скруглений. */
:root{
  --ink:#0a0a0a;
  --ink-2:#141414;
  --ink-3:#1d1d1d;
  --paper:#f4f2ee;
  --paper-dim:#a9a5a0;
  --blood:#c8102e;
  --blood-hot:#e11d34;
  --line:#2b2b2b;
  --warn:#d98324;
  --display:'Anton',Impact,'Haettenschweiler','Arial Narrow',sans-serif;
  --ui:'Oswald','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);
  font-family:var(--ui);font-weight:400;font-size:15px;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
/* Полутоновая сетка «комиксной» печати */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:5px 5px;
}
/* Зерно плёнки */
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
#app{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:0 16px}

h1{font-family:var(--display);font-size:clamp(26px,7.5vw,34px);line-height:1;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.02em;font-weight:400}
h2{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:26px 0 12px;font-weight:400;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:5px;height:19px;background:var(--blood);flex:none}
.eyebrow{text-transform:uppercase;letter-spacing:.26em;font-size:10px;color:var(--paper-dim);font-weight:500}
.dim{color:var(--paper-dim)}
.sub{color:var(--paper-dim);font-size:13.5px;line-height:1.55;margin:6px 0 16px}
.center{text-align:center}
.hidden{display:none !important}
.muted{color:var(--paper-dim);font-size:13px;line-height:1.55}

/* ---------- Шапка ---------- */
header{
  position:relative;z-index:2;padding:22px 16px 16px;margin:0 0 6px;
  border-bottom:3px solid var(--paper);
  background:linear-gradient(180deg,#111 0%,var(--ink) 100%);
  overflow:hidden;
}
header .stripes{position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(135deg,var(--blood) 0 14px,#000 14px 28px)}
header .inner{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.brand h1{font-size:clamp(30px,9vw,42px);margin:0}
.brand h1 .cut{color:var(--blood);text-shadow:2px 0 0 #000}
.brand .tag{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--paper-dim);font-weight:500}
.who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--paper-dim);letter-spacing:.05em;flex:none;padding-bottom:3px}
.who img,.who .ava{width:30px;height:30px;object-fit:cover;border:2px solid var(--line);flex:none}
.who .ava{display:grid;place-items:center;background:#000;color:var(--paper);font-family:var(--display);font-size:14px}

/* ---------- Карточки ---------- */
.card{background:var(--ink-2);border:2px solid var(--line);padding:16px;margin-bottom:14px;position:relative}
/* Заголовок вплотную к карточке: у Anton длинные выносные элементы задевают рамку. */
h1+.card,h1+.grid,h1+.chips{margin-top:16px}
.card.hi{border-color:var(--paper)}
.card.danger{border-color:var(--blood)}
.card h2{margin-top:0}
.warn{border-left:5px solid var(--blood);background:#160a0d;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-top:12px;color:#e8e4de}
.warn b{color:#fff}
.demo-note{border-left:5px solid var(--warn);background:#161208;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-top:14px;color:#e8e4de}

/* ---------- Категории / табы ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 18px}
.chip{
  background:transparent;border:2px solid var(--line);color:var(--paper-dim);
  font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 14px;cursor:pointer;
}
.chip.active{border-color:var(--blood);color:var(--paper);background:#160a0d}

/* ---------- Сетка товаров ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.pcard{background:var(--ink-2);border:2px solid var(--line);cursor:pointer;display:flex;flex-direction:column;position:relative}
.pcard:active{background:var(--ink-3)}
.pcard .imgwrap{width:100%;aspect-ratio:1/1;overflow:hidden;background:#000;border-bottom:2px solid var(--line)}
.pcard .imgwrap img{width:100%;height:100%;object-fit:cover;filter:grayscale(.25) contrast(1.05);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .imgwrap img{transform:scale(1.06)}
.imgwrap.placeholder,.hero-img.placeholder{
  display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,#0d0d0d 0 10px,#111 10px 20px);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;color:#3f3c39;font-size:26px;
}
.hero-img.placeholder{font-size:46px}
.pbody{padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.ptitle{font-size:14px;font-weight:500;line-height:1.3}
.pbottom{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto}
.pprice{font-family:var(--display);font-size:19px;line-height:1}
.tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);font-weight:500}

/* ---------- Кнопки ---------- */
.btn{
  display:block;width:100%;cursor:pointer;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:400;
  font-size:16px;padding:15px 16px;margin-top:11px;
  background:var(--blood);color:#fff;border:2px solid var(--blood);
  transition:transform .1s ease,background .15s ease;
}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper)}
.btn.ghost:active{background:var(--paper);color:#000}
.btn.dim{background:transparent;color:var(--paper-dim);border-color:var(--line);font-size:14px}
.btn.danger{background:transparent;color:var(--blood);border-color:var(--blood)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.small{font-size:13px;padding:11px 12px}
.btn.auto{width:auto;padding:0 18px;margin-top:0;font-size:14px}
.row{display:flex;gap:10px}

/* ---------- Формы ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.seg button{
  border:2px solid var(--line);background:transparent;color:var(--paper-dim);
  font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:11px 6px;cursor:pointer;transition:.12s;
}
.seg button.active{border-color:var(--blood);color:var(--paper);background:#160a0d}
label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);font-weight:500;display:block;margin-top:16px}
input,select,textarea{
  width:100%;padding:12px;font-size:15px;font-family:var(--ui);
  background:#000;color:var(--paper);border:2px solid var(--line);margin-top:8px;
}
textarea{resize:vertical;min-height:66px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--paper)}
input[type=file]{padding:9px;font-size:12px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--paper);font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:400}
.check input{width:auto;margin:0;accent-color:var(--blood)}
.qty{display:flex;align-items:center;gap:14px;margin-top:10px}
.qty button{width:44px;height:44px;border:2px solid var(--line);background:transparent;color:var(--paper);font-size:22px;cursor:pointer;line-height:1}
.qty span{font-family:var(--display);font-size:22px;min-width:28px;text-align:center}
.code-in{letter-spacing:.3em;text-transform:uppercase;font-family:var(--display);font-size:22px;text-align:center}

/* ---------- Итог ---------- */
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:12px;border-top:2px solid var(--line)}
.total span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.total b{font-family:var(--display);font-size:30px;font-weight:400}
.total b s{color:var(--paper-dim);font-size:17px;margin-right:9px;font-weight:400}

/* ---------- Пакеты трафика ---------- */
.pack{
  display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:11px;
  background:var(--ink-2);border:2px solid var(--line);cursor:pointer;position:relative;
  transition:border-color .15s ease,background .15s ease;
}
.pack:active{background:var(--ink-3)}
.pack.sel{border-color:var(--blood);background:#160a0d}
.pack .vol{font-family:var(--display);font-size:30px;line-height:1;min-width:82px}
.pack .vol em{font-style:normal;font-size:13px;color:var(--paper-dim);display:block;letter-spacing:.14em}
.pack .mid{flex:1;font-size:12px;color:var(--paper-dim);line-height:1.5}
.pack .price{font-family:var(--display);font-size:22px;white-space:nowrap}
.pack.sel .price{color:var(--blood)}
.pack .mark{position:absolute;top:-2px;right:-2px;background:var(--blood);color:#fff;font-size:9px;letter-spacing:.14em;padding:3px 7px;text-transform:uppercase;display:none}
.pack.best .mark{display:block}

/* ---------- Ключ / QR ---------- */
.code-box{
  background:#000;border:2px solid var(--line);padding:11px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  font-size:11px;word-break:break-all;line-height:1.5;color:#cfcbc5;max-height:86px;overflow:auto;margin-top:12px;
}
.qr{display:flex;justify-content:center;margin:14px 0 4px}
.qr img{width:190px;height:190px;image-rendering:pixelated;border:8px solid var(--paper);background:var(--paper)}

/* ---------- Счётчик трафика ---------- */
.meter-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px;gap:12px}
.meter-big{font-family:var(--display);font-size:38px;line-height:.95}
.meter-big small{font-size:13px;color:var(--paper-dim);font-family:var(--ui);font-weight:400;display:block;margin-top:4px}
.meter-right{text-align:right;font-size:12px;color:var(--paper-dim);letter-spacing:.05em;flex:none}
.bar{height:22px;background:#000;border:2px solid var(--paper);position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0%;
  background:repeating-linear-gradient(135deg,var(--blood) 0 9px,var(--blood-hot) 9px 18px);
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.full i{background:repeating-linear-gradient(135deg,#5a5a5a 0 9px,#3d3d3d 9px 18px)}
.bar-legend{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--paper-dim);letter-spacing:.08em;text-transform:uppercase}
.stat-row{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;border:2px solid var(--line);padding:9px 10px;background:#000;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:20px;line-height:1.15;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}

/* ---------- Рефералы ---------- */
.ref-hero{text-align:center;padding:6px 0 2px}
.ref-hero .pct{font-family:var(--display);font-size:64px;line-height:.9;color:var(--blood)}
.ref-hero .sub{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim);margin:3px 0 0}
.ref-grid{display:flex;gap:10px;margin:14px 0}
.ref-grid .stat{text-align:center}
.tier{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tier:last-child{border-bottom:none}
.tier b{color:var(--blood);font-weight:600}
.why{padding-left:18px;margin:2px 0 0}
.why li{margin-bottom:9px;font-size:13px;line-height:1.55;color:var(--paper-dim)}
.why li b{color:var(--paper);font-weight:600}

/* ---------- Состояние нод ----------
   Цвет никогда не единственный признак — рядом всегда значок и подпись. */
:root{--up:#f4f2ee;--deg:#d98324;--down:#c8102e;--nodata:#2b2b2b}
.hero{text-align:center;padding:6px 0 2px}
.hero .num{font-family:var(--display);font-size:56px;line-height:.95}
.hero .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);margin-top:4px}
.hero .sum{font-size:13px;color:#ddd9d4;margin-top:10px}
.hero .sum b{color:var(--paper)}
.legend-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:12px;border-top:2px solid var(--line)}
.legend-row span{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-dim)}
.sw{width:11px;height:11px;flex:none;background:var(--nodata)}
.sw.up{background:var(--up)}.sw.deg{background:var(--deg)}.sw.down{background:var(--down)}
.node{border:2px solid var(--line);background:#000;padding:12px;margin-bottom:10px}
.node-top{display:flex;align-items:center;gap:10px}
.node-name{font-family:var(--display);font-size:17px;line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntag{display:flex;align-items:center;gap:5px;flex:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;border:2px solid var(--line);padding:4px 8px;color:var(--paper-dim)}
.ntag.up{border-color:var(--up);color:var(--paper)}
.ntag.deg{border-color:var(--deg);color:var(--deg)}
.ntag.down{border-color:var(--down);color:var(--down)}
.node-sub{font-size:11.5px;color:var(--paper-dim);margin-top:6px;letter-spacing:.04em}
.node-sub b{color:var(--paper);font-weight:500}
.strip{display:flex;gap:2px;height:26px;margin-top:9px}
.strip i{flex:1;background:var(--nodata);cursor:pointer;transition:opacity .15s}
.strip i.up{background:var(--up)}.strip i.deg{background:var(--deg)}.strip i.down{background:var(--down)}
.strip i:active{opacity:.55}
.strip-ax{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-dim)}

/* ---------- Списки / статусы ---------- */
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border:2px solid var(--line);color:var(--paper-dim);font-weight:500;flex:none}
.pill.active,.pill.shipped{color:var(--paper);border-color:var(--paper)}
.pill.exp,.pill.canceled{color:var(--blood);border-color:var(--blood)}
.pill.new,.pill.processing{color:var(--warn);border-color:var(--warn)}
.pill.done{color:var(--paper-dim)}

/* ---------- Установка ---------- */
.steps{counter-reset:s;padding:0;margin:16px 0 0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:13px;font-size:13px;line-height:1.55;color:var(--paper-dim)}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;
  background:var(--blood);color:#fff;font-family:var(--display);font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.applink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);background:#000;margin-bottom:9px;cursor:pointer}
.applink:active{border-color:var(--blood)}
.applink b{font-size:14px;font-weight:600}
.applink span{font-size:11px;color:var(--paper-dim);letter-spacing:.05em}
.applink .go{font-family:var(--display);color:var(--blood);font-size:18px}

/* ---------- Галерея товара ---------- */
.hero-img{width:100%;aspect-ratio:1/1;object-fit:cover;border:2px solid var(--line);background:#000;filter:grayscale(.2) contrast(1.05)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:66px;height:66px;overflow:hidden;border:2px solid var(--line);cursor:pointer;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:0;right:0;width:20px;height:20px;border:none;background:var(--blood);color:#fff;cursor:pointer;font-size:11px;line-height:1}

/* ---------- Навигация ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:#050505;border-top:3px solid var(--paper);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button{
  flex:1;background:transparent;border:none;color:var(--paper-dim);cursor:pointer;
  padding:11px 2px 10px;font-family:var(--ui);font-weight:500;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;position:relative;
}
nav.bottom button .ic{display:block;font-size:16px;margin-bottom:3px;line-height:1}
nav.bottom button.on{color:var(--paper)}
nav.bottom button.on::before{content:"";position:absolute;top:0;left:10%;right:10%;height:3px;background:var(--blood)}
.back{background:none;border:none;color:var(--paper-dim);font-size:11px;cursor:pointer;padding:6px 0;font-family:var(--ui);font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.back:active{color:var(--paper)}

/* ---------- Служебное ---------- */
.screen{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.loader{text-align:center;padding:70px 20px;position:relative;z-index:2}
.loader .bars{display:flex;gap:5px;justify-content:center;margin-bottom:18px}
.loader .bars i{width:7px;height:34px;background:var(--blood);animation:pulse 1s infinite}
.loader .bars i:nth-child(2){animation-delay:.12s}
.loader .bars i:nth-child(3){animation-delay:.24s}
.loader .bars i:nth-child(4){animation-delay:.36s}
@keyframes pulse{0%,100%{transform:scaleY(.4);opacity:.4}50%{transform:scaleY(1);opacity:1}}
.loader p{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:13px;color:var(--paper-dim)}
.spinner{width:26px;height:26px;border:2px solid rgba(255,255,255,.14);border-top-color:var(--blood);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--paper-dim);font-size:13px;line-height:1.6;padding:22px 8px}
#toast{
  position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:100;
  background:var(--paper);color:#000;padding:13px 15px;font-weight:600;font-size:13px;
  border-left:6px solid var(--blood);max-width:608px;margin:0 auto;
  opacity:0;visibility:hidden;transform:translateY(24px);
  transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility .25s;
}
#toast.on{opacity:1;visibility:visible;transform:none}
.footer-links{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:22px 0 10px;padding-top:16px;border-top:2px solid var(--line)}
.footer-links a{color:var(--paper-dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;text-decoration:none;border:2px solid var(--line);padding:8px 11px;cursor:pointer}
.footer-links a:active{border-color:var(--blood);color:var(--paper)}
</style>
</head>
<body>

<header id="head" class="hidden">
  <div class="stripes"></div>
  <div class="inner">
    <div class="brand">
      <h1>ZV<span class="cut">O</span>N</h1>
      <span class="tag">Store</span>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>

<div id="loading" class="loader">
  <div class="bars"><i></i><i></i><i></i><i></i></div>
  <p>Подключение</p>
</div>

<div id="app"><div id="content" class="hidden"></div></div>

<nav class="bottom hidden" id="tabbar"></nav>
<div id="toast"></div>

<script>
/* Магазин Zvon — мини-апп экосистемы Vlyne.
 *
 * Два контура данных, и это важно понимать при чтении:
 *
 *  1. VPN (подписка, трафик, рефералка, ноды) принадлежит Telegram-аккаунту
 *     Vlyne. Zvon сюда ничего не дублирует: сервер проксирует запросы в бота
 *     через zvon.store.vpn.*, поэтому покупка из Telegram и покупка отсюда
 *     меняют одно и то же состояние, а ключ у человека ровно один.
 *     Доступно после привязки аккаунта кодом из команды /link в боте.
 *
 *  2. Мерч — собственный контур Zvon (MongoDB), в боте его нет:
 *     zvon.store.catalog/order/cabinet + админка.
 */

const OS_LIST = [["windows","Windows"],["macos","macOS"],["linux","Linux"],["android","Android"],["ios","iOS"]];
const OS_NAMES = Object.fromEntries(OS_LIST);
const APPS = {
  windows:[{n:"Vlyne Client",d:"Рекомендуем",u:"https://github.com/pkda1lu/vlyne-client/releases"}],
  macos:[{n:"V2rayU",d:"GitHub — рекомендуем",u:"https://github.com/yanue/V2rayU/releases"},
         {n:"Happ",d:"App Store",u:"https://apps.apple.com/us/app/happ-proxy-utility/id6504287215"}],
  android:[{n:"Happ",d:"Google Play — рекомендуем",u:"https://play.google.com/store/apps/details?id=com.happproxy"},
           {n:"Happ — APK",d:"Если Google Play недоступен",u:"https://github.com/Happ-proxy/happ-android/releases/latest/download/Happ.apk"},
           {n:"v2raytun",d:"Google Play",u:"https://play.google.com/store/apps/details?id=com.v2raytun.android"}],
  ios:[{n:"Happ",d:"App Store — Россия",u:"https://apps.apple.com/ru/app/happ-proxy-utility/id6783623643"},
       {n:"Happ",d:"App Store — глобальный",u:"https://apps.apple.com/us/app/happ-proxy-utility/id6504287215"}],
  linux:[{n:"v2ray-core",d:"GitHub",u:"https://github.com/v2fly/v2ray-core/releases"},
         {n:"Clash",d:"GitHub",u:"https://github.com/Dreamacro/clash/releases"}],
};
const SUPPORT_FALLBACK = "https://t.me/tpoutline";
const FULFILL_LABEL = { new:"Новый", processing:"В работе", shipped:"Отправлен", done:"Завершён" };
const FULFILL_NEXT = { new:"processing", processing:"shipped", shipped:"done", done:"done" };
const NODE_ST = {
  up:      { cls:"up",   ic:"●", label:"Работает"   },
  degraded:{ cls:"deg",  ic:"▲", label:"Сбои"       },
  down:    { cls:"down", ic:"✕", label:"Недоступна" },
  unknown: { cls:"",     ic:"?", label:"Нет данных" },
};

function detectOS(){
  const p=(navigator.userAgent||"").toLowerCase();
  if(/android/.test(p)) return "android";
  if(/iphone|ipad|ipod/.test(p)) return "ios";
  if(/mac os x|macintosh/.test(p)) return "macos";
  if(/linux/.test(p)) return "linux";
  return "windows";
}
const MY_OS = detectOS();

const STATE = {
  user:null, isAdmin:false, tab:"sub", screen:"main",
  // VPN-контур (данные принадлежат Telegram-аккаунту)
  vpn:{ available:false, linked:false, data:null, error:null },
  traffic:{ pack:null, promo:null, promoPct:0, method:"yookassa", order:null },
  nodes:{ loaded:false, data:null, error:null },
  installOS:MY_OS,
  // Контур мерча (собственный для Zvon)
  products:[], paymentMethods:[{id:"yookassa",label:"Карта"}],
  product:null,
  merch:{ qty:1, option:"", shipping:{}, promo:null, promoPct:0, method:"yookassa" },
  pay:null, result:null, cabinet:null,
  adminEdit:null,
};
const STORE = !!(window.zvon && window.zvon.store);

// ---------- helpers ----------
const $ = (s,r=document)=>r.querySelector(s);
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove("on"),3200); }
function copy(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Скопировано")).catch(()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Скопировано"); }catch(e){ toast("Не удалось скопировать"); }
  document.body.removeChild(ta);
}
function openUrl(u){ try{ window.open(u,"_blank","noopener"); }catch(e){ location.href=u; } }
function fmtDate(ts){ if(!ts) return "—"; const d=new Date(ts); return d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
function qrUrl(d){ return "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data="+encodeURIComponent(d); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(n){ return (n===0?"Бесплатно":n+" ₽"); }
function hourLabel(ts){ const d=new Date(ts*1000); return ("0"+d.getHours()).slice(-2)+":00"; }
async function S(p){ const d=await p; if(!d) throw new Error("Пустой ответ"); if(d.ok===false) throw new Error(d.error||"Ошибка"); return d; }
function supportUrl(){ return (STATE.vpn.data && STATE.vpn.data.support) || SUPPORT_FALLBACK; }

// ---------- bootstrap ----------
async function boot(){
  try { if(window.zvon){ const info=await zvon.init().catch(()=>null); STATE.user=(info&&info.user)||await zvon.getUser().catch(()=>null); } } catch(e){}
  if(!STATE.user) STATE.user={ _id:"guest", username:"Гость", avatar:null };

  if(STORE){
    try {
      const cat=await S(zvon.store.catalog());
      STATE.products=cat.products||[];
      STATE.isAdmin=!!cat.isAdmin;
      if(Array.isArray(cat.paymentMethods)&&cat.paymentMethods.length) STATE.paymentMethods=cat.paymentMethods;
      STATE.merch.method=(STATE.paymentMethods[0]||{}).id||"yookassa";
      if(cat.vpn){ STATE.vpn.available=!!cat.vpn.available; STATE.vpn.linked=!!cat.vpn.linked; STATE.vpn.error=cat.vpn.error||null; }
    } catch(e){ STATE.vpn.error=e.message; }
    if(STATE.vpn.linked) await loadVpn();
  } else {
    STATE.products=[{ id:"demo", type:"merch", title:"Футболка Zvon", description:"Демо-мерч", price:1490, images:[], merch:{options:["S","M","L"],requiresShipping:true} }];
  }

  // Без VPN-контура соответствующие вкладки не показываем вовсе.
  if(!STATE.vpn.available) STATE.tab="shop";

  $("#loading").classList.add("hidden");
  $("#head").classList.remove("hidden");
  $("#content").classList.remove("hidden");
  $("#tabbar").classList.remove("hidden");
  renderWho(); renderTabs(); render();
}

/** Состояние подписки из бота: ключ, трафик, рефералка, пакеты. */
async function loadVpn(){
  try {
    const st=await S(zvon.store.vpn.state());
    STATE.vpn.data=st; STATE.vpn.error=null;
    if(!STATE.traffic.pack && st.packs && st.packs.length){
      const best=st.packs.reduce((a,b)=> (b.gb/b.price > a.gb/a.price ? b : a), st.packs[0]);
      STATE.traffic.pack=best.code;
    }
    if(!st.cryptobot) STATE.traffic.method="yookassa";
  } catch(e){ STATE.vpn.data=null; STATE.vpn.error=e.message; }
}

function renderWho(){
  const u=STATE.user;
  const av=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:`<div class="ava">${(u.username||'?')[0].toUpperCase()}</div>`;
  $("#who").innerHTML=av+`<span>${esc(u.username||'Гость')}</span>`;
}

function renderTabs(){
  const tabs=[];
  if(STATE.vpn.available) tabs.push(["sub","▣","Ключ"],["buy","▲","Трафик"],["ref","✷","Друзья"],["nodes","◉","Серверы"]);
  tabs.push(["shop","◧","Мерч"],["install","⌁","Установка"]);
  const bar=$("#tabbar"); bar.innerHTML="";
  tabs.forEach(([id,ic,label])=>{
    const b=el(`<button class="${STATE.tab===id?'on':''}"><span class="ic">${ic}</span>${label}</button>`);
    b.onclick=()=>go(id);
    bar.appendChild(b);
  });
}
function go(tab, screen){
  STATE.tab=tab; STATE.screen=screen||"main"; STATE.adminEdit=null;
  renderTabs(); render();
}

function render(){
  const c=$("#content"); c.innerHTML="";
  const w=el(`<div class="screen"></div>`); c.appendChild(w);
  if(STATE.tab==="sub") renderSub(w);
  else if(STATE.tab==="buy") renderTraffic(w);
  else if(STATE.tab==="ref") renderRef(w);
  else if(STATE.tab==="nodes") renderNodes(w);
  else if(STATE.tab==="install") renderInstall(w);
  else if(STATE.tab==="shop"){
    if(STATE.screen==="admin") renderAdmin(w);
    else if(STATE.screen==="product") renderProduct(w);
    else if(STATE.screen==="pay") renderPay(w);
    else if(STATE.screen==="result") renderResult(w);
    else if(STATE.screen==="orders") renderCabinet(w);
    else renderCatalog(w);
  }
  if(STATE.screen!=="admin") w.appendChild(footerLinks());
  window.scrollTo(0,0);
}

function footerLinks(){
  const f=el(`<div class="footer-links"></div>`);
  const sup=el(`<a>Поддержка</a>`); sup.onclick=()=>openUrl(supportUrl());
  const inst=el(`<a>Как подключить</a>`); inst.onclick=()=>go("install");
  f.append(sup, inst);
  return f;
}

/* ==================== ПРИВЯЗКА АККАУНТА ====================
 * Подписка принадлежит Telegram-аккаунту, поэтому Zvon сначала должен узнать,
 * кто перед ним. Доказательством владения служит код из команды /link: взять
 * его можно только внутри бота. */
function renderLinkScreen(c){
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Аккаунт</div>`));
  c.appendChild(el(`<h1>Связать с Telegram</h1>`));
  c.appendChild(el(`<div class="sub">VPN-подписка Vlyne одна на человека: ключ, трафик и приглашённые друзья живут в вашем Telegram-аккаунте. Свяжите его с Zvon — и управлять всем этим можно будет из обоих мест.</div>`));

  const box=el(`<div class="card hi"></div>`);
  box.appendChild(el(`<h2>Код привязки</h2>`));
  box.appendChild(el(`<ol class="steps">
    <li>Откройте бота Vlyne в Telegram.</li>
    <li>«Подписка» → <b>«Связать с Zvon»</b> (или команда <b>/link</b>).</li>
    <li>Введите шестизначный код сюда — он живёт 10 минут.</li>
  </ol>`));
  const inp=el(`<input class="code-in" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="one-time-code">`);
  box.appendChild(inp);
  const btn=el(`<button class="btn">Связать</button>`);
  btn.onclick=async ()=>{
    const raw=(inp.value||"").trim();
    // Код входа в настольное приложение Vlyne — 8 символов с буквами через
    // дефис. Он выдаётся другой кнопкой и сюда не подойдёт, но перепутать их
    // легко, поэтому говорим об этом прямо, а не «код неверен».
    if(/[a-zA-Zа-яА-Я]/.test(raw)){
      toast("Это код для приложения Vlyne. Для Zvon нужен код из «Связать с Zvon» или /link");
      return;
    }
    const code=raw.replace(/\D/g,"");
    if(code.length!==6){ toast("Код состоит из 6 цифр"); return; }
    btn.disabled=true; btn.textContent="Связываем…";
    try {
      const r=await S(zvon.store.vpn.link(code));
      STATE.vpn.linked=true;
      await loadVpn();
      toast("Аккаунт связан"+(r.telegram&&r.telegram.name?(": "+r.telegram.name):""));
      renderTabs(); render();
    } catch(e){ toast(e.message); btn.disabled=false; btn.textContent="Связать"; }
  };
  box.appendChild(btn);
  c.appendChild(box);

  c.appendChild(el(`<div class="card">
    <h2>Что это даёт</h2>
    <ul class="why">
      <li><b>Один ключ, а не два.</b> Ссылка подписки та же, что в боте — клиент настраивается один раз.</li>
      <li><b>Общий трафик.</b> Купили пакет здесь — он виден в Telegram, и наоборот.</li>
      <li><b>Общая рефералка.</b> Приглашённые друзья и заработанные ГБ считаются в одном месте.</li>
      <li><b>Отвязать можно в любой момент</b> — здесь или командой /unlink в боте. Подписка при этом остаётся.</li>
    </ul>
  </div>`));

  const sup=el(`<button class="btn dim">Написать в поддержку</button>`); sup.onclick=()=>openUrl(supportUrl()); c.appendChild(sup);
}

/** true, если экран занят заглушкой: нет привязки либо состояние не загрузилось. */
function vpnGate(c){
  if(!STATE.vpn.linked){ renderLinkScreen(c); return true; }
  if(!STATE.vpn.data){
    c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Подписка</div>`));
    c.appendChild(el(`<h1>Не загрузилось</h1>`));
    c.appendChild(el(`<div class="card danger"><div class="empty">${esc(STATE.vpn.error||"Не удалось получить состояние подписки")}</div></div>`));
    const again=el(`<button class="btn ghost">Повторить</button>`);
    again.onclick=async ()=>{ again.disabled=true; again.textContent="Загружаем…"; await loadVpn(); render(); };
    c.appendChild(again);
    return true;
  }
  return false;
}

// ==================== КЛЮЧ И ТРАФИК ====================
function renderSub(c){
  if(vpnGate(c)) return;
  const s=STATE.vpn.data.subscription;
  const name=(STATE.vpn.data.user&&STATE.vpn.data.user.name)||"";
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Подписка Vlyne</div>`));
  c.appendChild(el(`<h1>Ваш доступ</h1>`));
  if(name) c.appendChild(el(`<div class="sub">Telegram: <b style="color:var(--paper)">${esc(name)}</b> — данные общие с ботом.</div>`));

  const empty = s.left<=0;
  const meter=el(`<div class="card hi"></div>`);
  meter.appendChild(el(`<h2>Ваш трафик</h2>`));
  meter.appendChild(el(`<div class="meter-top">
    <div class="meter-big">${esc(s.left_h)}<small>осталось из ${esc(s.limit_h)}</small></div>
    <div class="meter-right">${s.percent}%<br>израсходовано</div>
  </div>`));
  meter.appendChild(el(`<div class="bar ${empty?'full':''}"><i style="width:${s.percent}%"></i></div>`));
  meter.appendChild(el(`<div class="bar-legend"><span>${esc(s.used_h)} использовано</span><span>до ${esc(s.period_end)}</span></div>`));
  meter.appendChild(el(`<div class="stat-row">
    <div class="stat"><b>${s.free_gb} ГБ</b><span>Бесплатно в месяц</span></div>
    <div class="stat"><b>${esc(s.extra_h)}</b><span>Докуплено</span></div>
  </div>`));
  if(empty){
    meter.appendChild(el(`<div class="warn"><b>Лимит исчерпан.</b> Докупите трафик, чтобы продолжить пользоваться VPN.</div>`));
    const b=el(`<button class="btn">Докупить трафик</button>`); b.onclick=()=>go("buy"); meter.appendChild(b);
  }
  c.appendChild(meter);

  const key=el(`<div class="card"></div>`);
  key.appendChild(el(`<h2>Ваш ключ</h2>`));
  key.appendChild(el(`<p class="muted" style="margin:0 0 11px">Ссылка постоянная — она никогда не меняется и совпадает с той, что выдал бот. Настройте клиент один раз.</p>`));
  if(s.qr) key.appendChild(el(`<div class="qr"><img src="${esc(s.qr)}" alt="QR"></div>`));
  else if(s.url) key.appendChild(el(`<div class="qr"><img src="${qrUrl(s.url)}" alt="QR"></div>`));
  key.appendChild(el(`<div class="code-box">${esc(s.url||'')}</div>`));
  const cp=el(`<button class="btn">Скопировать ссылку</button>`); cp.onclick=()=>copy(s.url||""); key.appendChild(cp);
  const how=el(`<button class="btn ghost">Как подключить</button>`); how.onclick=()=>go("install"); key.appendChild(how);
  c.appendChild(key);

  const acc=el(`<div class="card"></div>`);
  acc.appendChild(el(`<h2>Аккаунт Telegram</h2>`));
  acc.appendChild(el(`<p class="muted" style="margin:0">Ключ, трафик и рефералка общие с ботом. После отвязки подписка никуда не денется — просто перестанет быть видна из Zvon.</p>`));
  const un=el(`<button class="btn dim">Отвязать Telegram</button>`);
  un.onclick=async ()=>{
    if(!confirm("Отвязать аккаунт Telegram? Подписка сохранится и останется доступной в боте.")) return;
    un.disabled=true; un.textContent="Отвязываем…";
    try {
      await S(zvon.store.vpn.unlink());
      STATE.vpn.linked=false; STATE.vpn.data=null; STATE.nodes={loaded:false,data:null,error:null};
      toast("Аккаунт отвязан"); renderTabs(); render();
    } catch(e){ toast(e.message); un.disabled=false; un.textContent="Отвязать Telegram"; }
  };
  acc.appendChild(un);
  c.appendChild(acc);
}

// ==================== ПОКУПКА ТРАФИКА ====================
function renderTraffic(c){
  if(vpnGate(c)) return;
  const d=STATE.vpn.data, packs=d.packs||[];
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Пополнение</div>`));
  c.appendChild(el(`<h1>Докупить трафик</h1>`));
  c.appendChild(el(`<div class="sub">Трафик добавится к текущей подписке. Ссылка не изменится, а неизрасходованный остаток перейдёт на следующий месяц. Покупка видна и здесь, и в боте.</div>`));

  const box=el(`<div class="card"></div>`);
  const best=packs.length?packs.reduce((a,b)=> (b.gb/b.price > a.gb/a.price ? b : a), packs[0]):null;
  packs.forEach(p=>{
    const node=el(`<div class="pack ${best&&p.code===best.code?'best':''} ${STATE.traffic.pack===p.code?'sel':''}">
      <span class="mark">Выгодно</span>
      <div class="vol">${p.gb}<em>ГБ</em></div>
      <div class="mid">Купит такой же друг по вашей ссылке — вам +${p.bonus_gb} ГБ</div>
      <div class="price">${p.price} ₽</div>
    </div>`);
    node.onclick=()=>{
      STATE.traffic.pack=p.code; STATE.traffic.promo=null; STATE.traffic.promoPct=0; STATE.traffic.order=null;
      render();
    };
    box.appendChild(node);
  });
  if(!packs.length) box.appendChild(el(`<div class="empty">Пакеты трафика недоступны.</div>`));

  box.appendChild(el(`<label>Промокод</label>`));
  const prow=el(`<div class="row" style="margin-top:8px"></div>`);
  const pin=el(`<input placeholder="Промокод" value="${esc(STATE.traffic.promo||'')}" autocomplete="off" spellcheck="false" style="margin-top:0;letter-spacing:.1em;text-transform:uppercase">`);
  const pok=el(`<button class="btn ghost auto">OK</button>`);
  pok.onclick=async ()=>{
    const code=(pin.value||"").trim().toUpperCase();
    if(!code || !STATE.traffic.pack){ STATE.traffic.promo=null; STATE.traffic.promoPct=0; render(); return; }
    try {
      const r=await S(zvon.store.vpn.promo(STATE.traffic.pack, code));
      STATE.traffic.promo=code; STATE.traffic.promoPct=r.percent||0;
      toast("Промокод применён: −"+r.percent+"%");
    } catch(e){ STATE.traffic.promo=null; STATE.traffic.promoPct=0; toast(e.message); }
    render();
  };
  prow.append(pin, pok); box.appendChild(prow);

  // Крипта показывается только если включена на стороне бота.
  if(d.cryptobot){
    box.appendChild(el(`<label>Способ оплаты</label>`));
    const seg=el(`<div class="seg" style="grid-template-columns:1fr 1fr"></div>`);
    [["yookassa","Карта"],["cryptobot","Крипта"]].forEach(([id,label])=>{
      const b=el(`<button class="${STATE.traffic.method===id?'active':''}">${label}</button>`);
      b.onclick=()=>{ STATE.traffic.method=id; render(); }; seg.appendChild(b);
    });
    box.appendChild(seg);
  }

  const pack=packs.find(p=>p.code===STATE.traffic.pack);
  const t=el(`<div class="total"><span>К оплате</span><b>—</b></div>`);
  if(pack){
    const now=Math.max(0, pack.price-Math.round(pack.price*STATE.traffic.promoPct/100));
    t.querySelector("b").innerHTML = STATE.traffic.promoPct>0 ? `<s>${pack.price} ₽</s>${now} ₽` : (pack.price+" ₽");
  }
  box.appendChild(t);
  c.appendChild(box);

  const pay=el(`<button class="btn">${STATE.traffic.method==='cryptobot'?'Оплатить криптой':'Оплатить картой'}</button>`);
  pay.onclick=()=>payTraffic(pay);
  c.appendChild(pay);

  if(STATE.traffic.order){
    c.appendChild(el(`<div class="warn">Оплатили? Вернитесь сюда и нажмите кнопку ниже — трафик зачислится сразу.</div>`));
    const chk=el(`<button class="btn ghost">Я оплатил — проверить</button>`);
    chk.onclick=async ()=>{
      chk.disabled=true; chk.textContent="Проверяем…";
      try {
        const r=await S(zvon.store.vpn.check(STATE.traffic.order));
        if(r.paid){
          toast(r.already?"Этот платёж уже зачислен":("Оплачено! +"+r.gb+" ГБ"));

// Порог тот же, что на бэкенде (DEGRADED_PCT).
function segClass(pct){
  if(pct===null||pct===undefined) return "";
  if(pct>=99) return "up";
  if(pct>0) return "deg";
  return "down";
}
function renderNodes(c){
  if(vpnGate(c)) return;
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Сеть</div>`));
  c.appendChild(el(`<h1>Доступность</h1>`));

  const hero=el(`<div class="card hi"><h2>Состояние сети</h2><div class="empty">Загружаю…</div></div>`);
  c.appendChild(hero);
  const listCard=el(`<div class="card hidden"><h2>Серверы</h2></div>`);
  c.appendChild(listCard);

  function setHero(html){ hero.innerHTML=`<h2>Состояние сети</h2>`+html; }

  function paint(data){
    const o=data.overall||{};
    if(!data.nodes || !data.nodes.length || !o.checks){
      setHero(`<div class="empty">Статистика собирается.<br>Первые данные появятся в течение нескольких минут после запуска мониторинга.</div>`);
      listCard.classList.add("hidden");
      return;
    }
    const days=Math.round((data.window_hours||168)/24);
    setHero(`<div class="hero">
      <div class="num">${o.uptime!==null?o.uptime+'%':'—'}</div>
      <div class="cap">общий аптайм за ${days} дн.</div>
      <div class="sum"><b>${o.up}</b> из <b>${o.total}</b> серверов работают</div>
    </div>`);

    listCard.innerHTML=`<h2>Серверы</h2>`;
    data.nodes.forEach(n=>{
      const st=NODE_ST[n.status]||NODE_ST.unknown;
      const bits=[];
      if(n.ms!==null&&n.ms!==undefined) bits.push(`<b>${n.ms} мс</b>`);
      if(n.uptime!==null&&n.uptime!==undefined) bits.push(`аптайм <b>${n.uptime}%</b>`);
      if(!bits.length) bits.push("данных пока нет");
      const hist=n.history||[];
      const segs=hist.map(h=>`<i class="${segClass(h.pct)}" data-ts="${h.ts}" data-pct="${h.pct===null?'':h.pct}" data-ms="${h.ms==null?'':h.ms}"></i>`).join("");
      const first=hist[0], last=hist[hist.length-1];
      listCard.appendChild(el(`<div class="node">
        <div class="node-top"><div class="node-name">${esc(n.name)}</div><div class="ntag ${st.cls}">${st.ic} ${st.label}</div></div>
        <div class="node-sub">${bits.join(" · ")}</div>
        <div class="strip">${segs}</div>
        ${first&&last?`<div class="strip-ax"><span>${hourLabel(first.ts)}</span><span>за ${data.chart_hours} ч</span><span>${hourLabel(last.ts)}</span></div>`:''}
      </div>`));
    });
    listCard.appendChild(el(`<div class="legend-row">
      <span><i class="sw up"></i>● Работает</span>
      <span><i class="sw deg"></i>▲ Сбои</span>
      <span><i class="sw down"></i>✕ Недоступна</span>
      <span><i class="sw"></i>? Нет данных</span>
    </div>`));
    const rf=el(`<button class="btn dim">Обновить</button>`);
    rf.onclick=()=>load(true);
    listCard.appendChild(rf);
    listCard.classList.remove("hidden");
  }

  async function load(force){
    if(STATE.nodes.loaded && !force){ paint(STATE.nodes.data); return; }
    try {
      const data=await S(zvon.store.vpn.nodes());
      STATE.nodes={ loaded:true, data, error:null };
      paint(data);
    } catch(e){
      STATE.nodes={ loaded:false, data:null, error:e.message };
      setHero(`<div class="empty">${esc(e.message)}</div>`);
      listCard.classList.add("hidden");
    }
  }
  load(false);
}

    holder.innerHTML="";
    const merch=r.merch||[];
    if(!merch.length) holder.appendChild(el(`<div class="card"><div class="empty">Пока нет заказов мерча.</div></div>`));
    merch.forEach(m=>{
      holder.appendChild(el(`<div class="card">
        <div class="flex-between"><div class="ptitle">${esc(m.title)} ×${m.qty}</div><span class="pill ${m.fulfillment}">${FULFILL_LABEL[m.fulfillment]||m.fulfillment}</span></div>
        <div class="muted" style="font-size:12.5px;margin-top:8px">${fmtDate(m.createdAt)} · ${m.amount} ₽</div>
        ${m.shipping&&m.shipping.address?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(m.shipping.address)}${m.shipping.option?(' · '+esc(m.shipping.option)):''}</div>`:''}
      </div>`));
    });

    // Прежние VPN-заказы Zvon: ключи, выданные до объединения с Telegram,
    // работают до истечения срока — показываем их архивом, чтобы человек
    // не потерял доступ, но новые пакеты покупались уже на вкладке «Трафик».
    const subs=r.subscriptions||[];
    if(subs.length){
      holder.appendChild(el(`<h2>Прежние ключи Zvon</h2>`));
      holder.appendChild(el(`<p class="muted" style="margin:-4px 0 12px">Выданы до объединения с Telegram. Работают до истечения срока; новые пакеты покупаются на вкладке «Трафик».</p>`));
      subs.forEach(s=>{
        const active=s.expiryMs && s.expiryMs>Date.now();
        const card=el(`<div class="card">
          <div class="flex-between"><div class="ptitle">${esc(s.title)}</div><span class="pill ${active?'active':'exp'}">${active?'активен':'истёк'}</span></div>
          <div class="muted" style="font-size:12.5px;margin-top:8px">${fmtDate(s.createdAt)} → ${s.expiryMs?fmtDate(s.expiryMs):'—'}</div>
        </div>`);
        if(s.subUrl && active){
          const b=el(`<button class="btn dim small">Ключ и QR</button>`);
          b.onclick=()=>{
            if(card.querySelector(".qr")) return;
            card.appendChild(el(`<div class="qr"><img src="${qrUrl(s.subUrl)}" alt="QR"></div>`));
            card.appendChild(el(`<div class="code-box">${esc(s.subUrl)}</div>`));
            const cp=el(`<button class="btn small">Скопировать</button>`); cp.onclick=()=>copy(s.subUrl); card.appendChild(cp);
          };
          card.appendChild(b);
        }
        holder.appendChild(card);
      });
    }
  } catch(e){ holder.innerHTML=""; holder.appendChild(el(`<div class="card"><div class="empty">${esc(e.message)}</div></div>`)); }
}

// ==================== АДМИНКА ====================
async function renderAdmin(c){
  const back=el(`<button class="back">← Витрина</button>`); back.onclick=()=>go("shop"); c.appendChild(back);
  c.appendChild(el(`<div class="eyebrow">Управление</div>`));
  c.appendChild(el(`<h1>Админка</h1>`));
  if(STATE.adminEdit!==null){ renderProductForm(c, STATE.adminEdit); return; }

  const addBtn=el(`<button class="btn">+ Добавить товар</button>`);
  addBtn.onclick=()=>{ STATE.adminEdit={ type:"merch", title:"", description:"", price:0, images:[], active:true, sortOrder:0, merch:{stock:"",requiresShipping:true,options:""} }; render(); };
  c.appendChild(addBtn);

  c.appendChild(el(`<h2>Товары</h2>`));
  const holder=el(`<div><div class="spinner"></div></div>`); c.appendChild(holder);
  try {
    const r=await S(zvon.store.admin.products());
    holder.innerHTML="";
    const list=r.products||[];
    if(!list.length) holder.appendChild(el(`<div class="card"><div class="empty">Товаров нет.</div></div>`));
    list.forEach(p=>{
      const legacy = p.type==="vpn";
      const thumb = p.images&&p.images[0] ? `<img src="${esc(p.images[0])}" style="width:100%;height:100%;object-fit:cover">` : (legacy?"VPN":"Мерч");
      const item=el(`<div class="card"><div class="row" style="align-items:center;gap:14px">
        <div style="width:54px;height:54px;overflow:hidden;flex:none;background:#000;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:12px;color:#3f3c39">${thumb}</div>
        <div style="flex:1;min-width:0">
          <div class="ptitle">${esc(p.title)} ${p.active?'':'<span class="pill exp">скрыт</span>'}</div>
          <div class="tag" style="margin-top:4px">${p.type} · ${money(p.price)}</div>
        </div>
      </div></div>`);
      if(legacy){
        item.appendChild(el(`<div class="warn">Устаревший тариф. В витрину не попадает: VPN теперь общий с Telegram, тарифы и цены редактируются в боте.</div>`));
      }
      const row=el(`<div class="row" style="margin-top:12px"></div>`);
      if(!legacy){
        const edit=el(`<button class="btn ghost small" style="flex:1;margin-top:0">Изменить</button>`);
        edit.onclick=()=>{ STATE.adminEdit=adminToForm(p); render(); };
        row.appendChild(edit);
      }
      const del=el(`<button class="btn danger small" style="flex:1;margin-top:0">Удалить</button>`);
      del.onclick=async ()=>{ if(!confirm("Удалить товар?")) return; try{ await S(zvon.store.admin.remove(p.id)); toast("Удалено"); render(); }catch(e){ toast(e.message); } };
      row.appendChild(del); item.appendChild(row);
      holder.appendChild(item);
    });
  } catch(e){ holder.innerHTML=""; holder.appendChild(el(`<div class="card"><div class="empty">${esc(e.message)}</div></div>`)); }

  c.appendChild(el(`<h2>Заказы</h2>`));
  const oh=el(`<div><div class="spinner"></div></div>`); c.appendChild(oh);
  try {
    const r=await S(zvon.store.admin.orders());
    oh.innerHTML="";
    if(!(r.orders||[]).length) oh.appendChild(el(`<div class="card"><div class="empty">Заказов нет.</div></div>`));
    (r.orders||[]).forEach(o=>{
      const cls=o.status==='paid'?'active':(o.status==='canceled'?'canceled':'new');
      const card=el(`<div class="card">
        <div class="flex-between"><div class="ptitle">${esc(o.title)} ${o.type==='merch'?('×'+o.qty):''}</div><span class="pill ${cls}">${esc(o.status)}</span></div>
        <div class="muted" style="font-size:12px;margin-top:8px">@${esc(o.username||'?')} · ${o.amount} ₽ · ${esc(o.provider||'')} · ${fmtDate(o.createdAt)}</div>
        ${o.type==='merch'&&o.shipping?`<div class="muted" style="font-size:12px;margin-top:8px">${esc(o.shipping.name||'')} · ${esc(o.shipping.phone||'')}<br>${esc(o.shipping.address||'')}${o.shipping.option?(' · '+esc(o.shipping.option)):''}${o.shipping.comment?('<br>'+esc(o.shipping.comment)):''}</div>`:''}
      </div>`);
      if(o.type==='merch' && o.status==='paid'){
        const fr=el(`<div class="flex-between" style="margin-top:12px"><span class="pill ${o.fulfillment}">${FULFILL_LABEL[o.fulfillment]||o.fulfillment}</span></div>`);
        if(o.fulfillment!=='done'){
          const nx=el(`<button class="btn ghost small auto">→ ${FULFILL_LABEL[FULFILL_NEXT[o.fulfillment]]}</button>`);
          nx.onclick=async ()=>{ try{ await S(zvon.store.admin.fulfill(o.orderId, FULFILL_NEXT[o.fulfillment])); toast("Обновлено"); render(); }catch(e){ toast(e.message); } };
          fr.appendChild(nx);
        }
        card.appendChild(fr);
      }
      oh.appendChild(card);
    });
  } catch(e){ oh.innerHTML=""; oh.appendChild(el(`<div class="card"><div class="empty">${esc(e.message)}</div></div>`)); }
}

function adminToForm(p){
  return { id:p.id, type:"merch", title:p.title, description:p.description||"", price:p.price,
    images:[...(p.images||[])], active:p.active!==false, sortOrder:p.sortOrder||0,
    merch:{ stock:(p.merch&&p.merch.stock!=null)?p.merch.stock:"", requiresShipping:p.merch?p.merch.requiresShipping!==false:true, options:(p.merch?.options||[]).join(", ") } };
}

function renderProductForm(c, f){
  const back=el(`<button class="back">← К списку</button>`); back.onclick=()=>{ STATE.adminEdit=null; render(); }; c.appendChild(back);
  c.appendChild(el(`<h1>${f.id?'Изменить товар':'Новый товар'}</h1>`));
  const box=el(`<div class="card" style="margin-top:10px"></div>`);

  const title=el(`<input placeholder="Название" value="${esc(f.title)}">`); title.oninput=e=>f.title=e.target.value;
  box.appendChild(el(`<label style="margin-top:0">Название</label>`)); box.appendChild(title);
  const desc=el(`<textarea placeholder="Описание">${esc(f.description)}</textarea>`); desc.oninput=e=>f.description=e.target.value;
  box.appendChild(el(`<label>Описание</label>`)); box.appendChild(desc);
  const price=el(`<input type="number" inputmode="numeric" value="${f.price}">`); price.oninput=e=>f.price=parseInt(e.target.value,10)||0;
  box.appendChild(el(`<label>Цена, ₽ (0 = бесплатно)</label>`)); box.appendChild(price);
  const sort=el(`<input type="number" inputmode="numeric" value="${f.sortOrder}">`); sort.oninput=e=>f.sortOrder=parseInt(e.target.value,10)||0;
  box.appendChild(el(`<label>Порядок сортировки</label>`)); box.appendChild(sort);

  box.appendChild(el(`<label>Картинки</label>`));
  const thumbs=el(`<div class="thumbs"></div>`);
  function redrawThumbs(){ thumbs.innerHTML=""; f.images.forEach((u,i)=>{ const t=el(`<div class="thumb"><img src="${esc(u)}"><button>✕</button></div>`); t.querySelector("button").onclick=()=>{ f.images.splice(i,1); redrawThumbs(); }; thumbs.appendChild(t); }); }
  redrawThumbs(); box.appendChild(thumbs);
  const imgRow=el(`<div class="row" style="margin-top:10px"></div>`);
  const urlInp=el(`<input placeholder="URL картинки" style="margin-top:0">`);
  const addUrl=el(`<button class="btn ghost auto">+ URL</button>`); addUrl.onclick=()=>{ const u=(urlInp.value||"").trim(); if(u){ f.images.push(u); urlInp.value=""; redrawThumbs(); } };
  imgRow.append(urlInp, addUrl); box.appendChild(imgRow);
  const fileInp=el(`<input type="file" accept="image/*" style="margin-top:10px">`);
  fileInp.onchange=async ()=>{
    const file=fileInp.files[0]; if(!file) return;
    if(!STORE){ toast("Загрузка только внутри Zvon"); return; }
    const reader=new FileReader();
    reader.onload=async ()=>{ try{ const r=await S(zvon.store.admin.upload(reader.result)); f.images.push(r.url); redrawThumbs(); toast("Картинка загружена"); }catch(e){ toast(e.message); } };
    reader.readAsDataURL(file); fileInp.value="";
  };
  box.appendChild(el(`<div class="muted" style="font-size:12px;margin-top:8px">или загрузите файл:</div>`)); box.appendChild(fileInp);

  const stock=el(`<input placeholder="пусто = без ограничения" inputmode="numeric" value="${esc(f.merch.stock)}">`); stock.oninput=e=>f.merch.stock=e.target.value;
  box.appendChild(el(`<label>Остаток на складе</label>`)); box.appendChild(stock);
  const opts=el(`<input placeholder="через запятую: S, M, L" value="${esc(f.merch.options)}">`); opts.oninput=e=>f.merch.options=e.target.value;
  box.appendChild(el(`<label>Варианты (размеры и т.п.)</label>`)); box.appendChild(opts);
  const sh=el(`<label class="check"><input type="checkbox" ${f.merch.requiresShipping?'checked':''}> Требуется адрес доставки</label>`); sh.querySelector("input").onchange=e=>f.merch.requiresShipping=e.target.checked; box.appendChild(sh);
  const act=el(`<label class="check"><input type="checkbox" ${f.active?'checked':''}> Показывать в каталоге</label>`); act.querySelector("input").onchange=e=>f.active=e.target.checked; box.appendChild(act);
  c.appendChild(box);

  const save=el(`<button class="btn">Сохранить</button>`);
  save.onclick=async ()=>{
    if(!f.title.trim()){ toast("Укажите название"); return; }
    save.disabled=true; save.textContent="Сохраняем…";
    const payload={ type:"merch", title:f.title, description:f.description, price:f.price, images:f.images, active:f.active, sortOrder:f.sortOrder,
      merch:{ stock:f.merch.stock===""?null:f.merch.stock, requiresShipping:f.merch.requiresShipping, options:f.merch.options } };
    try {
      if(f.id) await S(zvon.store.admin.update(f.id, payload)); else await S(zvon.store.admin.create(payload));
      toast("Сохранено"); STATE.adminEdit=null;
      const cat=await S(zvon.store.catalog()); STATE.products=cat.products||[]; render();
    } catch(e){ toast(e.message); save.disabled=false; save.textContent="Сохранить"; }
  };
  c.appendChild(save);
  if(f.id){
    const del=el(`<button class="btn danger">Удалить товар</button>`);
    del.onclick=async ()=>{ if(!confirm("Удалить товар?")) return; try{ await S(zvon.store.admin.remove(f.id)); toast("Удалено"); STATE.adminEdit=null; const cat=await S(zvon.store.catalog()); STATE.products=cat.products||[]; render(); }catch(e){ toast(e.message); } };
    c.appendChild(del);
  }
}

// ---------- старт ----------
function safeBoot(){
  boot().catch(e=>{
    $("#loading").innerHTML =
      '<p style="font-family:Anton,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c8102e">Не удалось загрузить</p>'+
      '<p style="font-size:13px;color:#a9a5a0">'+esc(e.message||"Попробуйте открыть магазин заново")+'</p>';
  });
}
if(window.zvon) safeBoot();
else window.addEventListener("zvon-sdk-ready", safeBoot, { once:true });
setTimeout(()=>{ if($("#loading") && !$("#loading").classList.contains("hidden")) safeBoot(); }, 1500);
</script>
