<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Магазин Zvon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="/zvon-sdk.js"></script>
<style>
/* Визуальный язык — брутальная «комиксная» печать: плашечный чёрный,
 * бумажный светлый, кроваво-красный акцент, жёсткие рамки без скруглений. */
:root{
  --ink:#0a0a0a;
  --ink-2:#141414;
  --ink-3:#1d1d1d;
  --paper:#f4f2ee;
  --paper-dim:#a9a5a0;
  --blood:#c8102e;
  --blood-hot:#e11d34;
  --line:#2b2b2b;
  --ok:#f4f2ee;
  --warn:#d98324;
  --display:'Anton',Impact,'Haettenschweiler','Arial Narrow',sans-serif;
  --ui:'Oswald','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);color:var(--paper);
  font-family:var(--ui);font-weight:400;font-size:15px;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
/* Полутоновая сетка «комиксной» печати */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:5px 5px;
}
/* Зерно плёнки */
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
#app{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:0 16px}

h1{font-family:var(--display);font-size:clamp(26px,7.5vw,34px);line-height:1;margin:4px 0 2px;text-transform:uppercase;letter-spacing:.02em;font-weight:400}
h2{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em;margin:26px 0 12px;font-weight:400;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:5px;height:19px;background:var(--blood);flex:none}
.eyebrow{text-transform:uppercase;letter-spacing:.26em;font-size:10px;color:var(--paper-dim);font-weight:500}
.dim{color:var(--paper-dim)}
.faint{color:#6e6a66}
.sub{color:var(--paper-dim);font-size:13.5px;line-height:1.55;margin:6px 0 16px}
.center{text-align:center}
.hidden{display:none !important}
.muted{color:var(--paper-dim);font-size:13px;line-height:1.55}

/* ---------- Шапка ---------- */
header{
  position:relative;z-index:2;padding:22px 16px 16px;margin:0 0 6px;
  border-bottom:3px solid var(--paper);
  background:linear-gradient(180deg,#111 0%,var(--ink) 100%);
  overflow:hidden;
}
header .stripes{position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(135deg,var(--blood) 0 14px,#000 14px 28px)}
header .inner{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.brand h1{font-size:clamp(30px,9vw,42px);margin:0}
.brand h1 .cut{color:var(--blood);text-shadow:2px 0 0 #000}
.brand .tag{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--paper-dim);font-weight:500}
.who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--paper-dim);letter-spacing:.05em;flex:none;padding-bottom:3px}
.who img,.who .ava{width:30px;height:30px;object-fit:cover;border:2px solid var(--line);flex:none}
.who .ava{display:grid;place-items:center;background:#000;color:var(--paper);font-family:var(--display);font-size:14px}

/* ---------- Карточки ---------- */
.card{background:var(--ink-2);border:2px solid var(--line);padding:16px;margin-bottom:14px;position:relative}
.card.hi{border-color:var(--paper)}
.card.danger{border-color:var(--blood)}
.card h2{margin-top:0}
.warn{border-left:5px solid var(--blood);background:#160a0d;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-top:12px;color:#e8e4de}
.demo-note{border-left:5px solid var(--warn);background:#161208;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-top:14px;color:#e8e4de}

/* ---------- Категории ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 18px}
.chip{
  background:transparent;border:2px solid var(--line);color:var(--paper-dim);
  font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 14px;cursor:pointer;
}
.chip.active{border-color:var(--blood);color:var(--paper);background:#160a0d}

/* ---------- Сетка товаров ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.pcard{background:var(--ink-2);border:2px solid var(--line);cursor:pointer;display:flex;flex-direction:column;position:relative;transition:border-color .15s ease}
.pcard:active{background:var(--ink-3)}
.pcard.best{border-color:var(--blood)}
.pcard .mark{position:absolute;top:-2px;right:-2px;background:var(--blood);color:#fff;font-size:9px;letter-spacing:.14em;padding:3px 7px;text-transform:uppercase;z-index:3}
.pcard .imgwrap{width:100%;aspect-ratio:1/1;overflow:hidden;background:#000;border-bottom:2px solid var(--line);position:relative}
.pcard .imgwrap img{width:100%;height:100%;object-fit:cover;filter:grayscale(.25) contrast(1.05);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .imgwrap img{transform:scale(1.06)}
.imgwrap.placeholder,.hero-img.placeholder{
  display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,#0d0d0d 0 10px,#111 10px 20px);
  font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;
  color:#3f3c39;font-size:26px;
}
.hero-img.placeholder{font-size:46px}
.pbody{padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.ptitle{font-size:14px;font-weight:500;line-height:1.3}
.pbottom{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:auto}
.pprice{font-family:var(--display);font-size:19px;line-height:1}
.tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);font-weight:500}
.perday{font-size:10.5px;letter-spacing:.06em;color:var(--paper-dim)}

/* ---------- Кнопки ---------- */
.btn{
  display:block;width:100%;cursor:pointer;
  font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:400;
  font-size:16px;padding:15px 16px;margin-top:11px;
  background:var(--blood);color:#fff;border:2px solid var(--blood);
  transition:transform .1s ease,background .15s ease;
}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--paper)}
.btn.ghost:active{background:var(--paper);color:#000}
.btn.dim{background:transparent;color:var(--paper-dim);border-color:var(--line);font-size:14px}
.btn.danger{background:transparent;color:var(--blood);border-color:var(--blood)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.small{font-size:13px;padding:11px 12px}
.btn.auto{width:auto;padding:0 18px;margin-top:0;font-size:14px}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}

/* ---------- Формы ---------- */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.seg button{
  border:2px solid var(--line);background:transparent;color:var(--paper-dim);
  font-family:var(--ui);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:11px 6px;cursor:pointer;transition:.12s;
}
.seg button.active{border-color:var(--blood);color:var(--paper);background:#160a0d}
label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);font-weight:500;display:block;margin-top:16px}
input,select,textarea{
  width:100%;padding:12px;font-size:15px;font-family:var(--ui);
  background:#000;color:var(--paper);border:2px solid var(--line);margin-top:8px;
}
textarea{resize:vertical;min-height:66px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--paper)}
input[type=file]{padding:9px;font-size:12px}
.check{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--paper);font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:400}
.check input{width:auto;margin:0;accent-color:var(--blood)}
.qty{display:flex;align-items:center;gap:14px;margin-top:10px}
.qty button{width:44px;height:44px;border:2px solid var(--line);background:transparent;color:var(--paper);font-size:22px;cursor:pointer;line-height:1}
.qty span{font-family:var(--display);font-size:22px;min-width:28px;text-align:center}

/* ---------- Итог / промокод ---------- */
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:12px;border-top:2px solid var(--line)}
.total span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.total b{font-family:var(--display);font-size:30px;font-weight:400}
.total b s{color:var(--paper-dim);font-size:17px;margin-right:9px;font-weight:400}

/* ---------- Ключ / QR ---------- */
.code-box{
  background:#000;border:2px solid var(--line);padding:11px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  font-size:11px;word-break:break-all;line-height:1.5;color:#cfcbc5;max-height:86px;overflow:auto;margin-top:12px;
}
.qr{display:flex;justify-content:center;margin:14px 0 4px}
.qr img{width:190px;height:190px;image-rendering:pixelated;border:8px solid var(--paper);background:var(--paper)}
pre.instr{white-space:pre-wrap;font-family:var(--ui);font-size:13px;margin:0;color:var(--paper-dim);line-height:1.6}

/* ---------- Счётчик подписки ---------- */
.meter-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px;gap:12px}
.meter-big{font-family:var(--display);font-size:38px;line-height:.95}
.meter-big small{font-size:13px;color:var(--paper-dim);font-family:var(--ui);font-weight:400;display:block;margin-top:4px}
.meter-right{text-align:right;font-size:12px;color:var(--paper-dim);letter-spacing:.05em;flex:none}
.bar{height:22px;background:#000;border:2px solid var(--paper);position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0%;
  background:repeating-linear-gradient(135deg,var(--blood) 0 9px,var(--blood-hot) 9px 18px);
  transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.full i{background:repeating-linear-gradient(135deg,#5a5a5a 0 9px,#3d3d3d 9px 18px)}
.bar-legend{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--paper-dim);letter-spacing:.08em;text-transform:uppercase}
.stat-row{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;border:2px solid var(--line);padding:9px 10px;background:#000;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:20px;line-height:1.15;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}

/* ---------- Списки / статусы ---------- */
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;
  border:2px solid var(--line);color:var(--paper-dim);font-weight:500;flex:none;
}
.pill.active,.pill.shipped{color:var(--paper);border-color:var(--paper)}
.pill.exp,.pill.canceled{color:var(--blood);border-color:var(--blood)}
.pill.new,.pill.processing{color:var(--warn);border-color:var(--warn)}
.pill.done{color:var(--paper-dim)}

/* ---------- Установка ---------- */
.steps{counter-reset:s;padding:0;margin:16px 0 0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:13px;font-size:13px;line-height:1.55;color:var(--paper-dim)}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;
  background:var(--blood);color:#fff;font-family:var(--display);font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.applink{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);background:#000;margin-bottom:9px;cursor:pointer}
.applink:active{border-color:var(--blood)}
.applink b{font-size:14px;font-weight:600}
.applink span{font-size:11px;color:var(--paper-dim);letter-spacing:.05em}
.applink .go{font-family:var(--display);color:var(--blood);font-size:18px}
.why{padding-left:18px;margin:2px 0 0}
.why li{margin-bottom:9px;font-size:13px;line-height:1.55;color:var(--paper-dim)}
.why li b{color:var(--paper);font-weight:600}

/* ---------- Галерея товара ---------- */
.hero-img{width:100%;aspect-ratio:1/1;object-fit:cover;border:2px solid var(--line);background:#000;filter:grayscale(.2) contrast(1.05)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:66px;height:66px;overflow:hidden;border:2px solid var(--line);cursor:pointer;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:0;right:0;width:20px;height:20px;border:none;background:var(--blood);color:#fff;cursor:pointer;font-size:11px;line-height:1}

/* ---------- Навигация ---------- */
nav.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:#050505;border-top:3px solid var(--paper);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button{
  flex:1;background:transparent;border:none;color:var(--paper-dim);cursor:pointer;
  padding:11px 3px 10px;font-family:var(--ui);font-weight:500;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;position:relative;
}
nav.bottom button .ic{display:block;font-size:17px;margin-bottom:3px;line-height:1}
nav.bottom button.on{color:var(--paper)}
nav.bottom button.on::before{content:"";position:absolute;top:0;left:12%;right:12%;height:3px;background:var(--blood)}

.back{background:none;border:none;color:var(--paper-dim);font-size:11px;cursor:pointer;padding:6px 0;font-family:var(--ui);font-weight:500;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.back:active{color:var(--paper)}

/* ---------- Служебное ---------- */
.screen{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.loader{text-align:center;padding:70px 20px;position:relative;z-index:2}
.loader .bars{display:flex;gap:5px;justify-content:center;margin-bottom:18px}
.loader .bars i{width:7px;height:34px;background:var(--blood);animation:pulse 1s infinite}
.loader .bars i:nth-child(2){animation-delay:.12s}
.loader .bars i:nth-child(3){animation-delay:.24s}
.loader .bars i:nth-child(4){animation-delay:.36s}
@keyframes pulse{0%,100%{transform:scaleY(.4);opacity:.4}50%{transform:scaleY(1);opacity:1}}
.loader p{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:13px;color:var(--paper-dim)}
.spinner{width:26px;height:26px;border:2px solid rgba(255,255,255,.14);border-top-color:var(--blood);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--paper-dim);font-size:13px;line-height:1.6;padding:22px 8px}
#toast{
  position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:100;
  background:var(--paper);color:#000;padding:13px 15px;font-weight:600;font-size:13px;
  border-left:6px solid var(--blood);max-width:608px;margin:0 auto;
  opacity:0;visibility:hidden;transform:translateY(24px);
  transition:opacity .25s ease,transform .3s cubic-bezier(.2,.8,.2,1),visibility .25s;
}
#toast.on{opacity:1;visibility:visible;transform:none}
.footer-links{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:22px 0 10px;padding-top:16px;border-top:2px solid var(--line)}
.footer-links a{color:var(--paper-dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;text-decoration:none;border:2px solid var(--line);padding:8px 11px;cursor:pointer}
.footer-links a:active{border-color:var(--blood);color:var(--paper)}
</style>
</head>
<body>

<header id="head" class="hidden">
  <div class="stripes"></div>
  <div class="inner">
    <div class="brand">
      <h1>ZV<span class="cut">O</span>N</h1>
      <span class="tag">Store</span>
    </div>
    <div class="who" id="who"></div>
  </div>
</header>

<div id="loading" class="loader">
  <div class="bars"><i></i><i></i><i></i><i></i></div>
  <p>Подключение</p>
</div>

<div id="app">
  <div id="content" class="hidden"></div>
</div>

<nav class="bottom hidden" id="tabbar"></nav>
<div id="toast"></div>

<script>
/* Магазин Zvon — мини-апп. Оплата и выдача идут через store-бэкенд Zvon
 * (zvon.store.*): сервер сам обращается к YooKassa/CryptoBot и провижинеру. */

const OS_LIST = [["windows","Windows"],["macos","macOS"],["linux","Linux"],["android","Android"],["ios","iOS"]];
const OS_NAMES = Object.fromEntries(OS_LIST);
const OS_INSTRUCTIONS = {

  ios:"iOS\n• Установите v2raytun из App Store\n• Импортируйте конфигурацию ниже",
  linux:"Linux\n• v2ray-core: github.com/v2fly/v2ray-core/releases\n• Настройте конфигурацию ниже",
};
/* Каталог клиентов — перенесён из оригинального VPN-магазина. */
const APPS = {

         {n:"Happ",d:"App Store",u:"https://apps.apple.com/us/app/happ-proxy-utility/id6504287215"}],
  android:[{n:"Happ",d:"Google Play — рекомендуем",u:"https://play.google.com/store/apps/details?id=com.happproxy"},
           {n:"Happ — APK",d:"Если Google Play недоступен",u:"https://github.com/Happ-proxy/happ-android/releases/latest/download/Happ.apk"},
           {n:"v2raytun",d:"Google Play",u:"https://play.google.com/store/apps/details?id=com.v2raytun.android"}],
  ios:[{n:"Happ",d:"App Store — Россия",u:"https://apps.apple.com/ru/app/happ-proxy-utility/id6783623643"},
       {n:"Happ",d:"App Store — глобальный",u:"https://apps.apple.com/us/app/happ-proxy-utility/id6504287215"},
       {n:"v2raytun",d:"App Store",u:"https://apps.apple.com/app/v2raytun/id6476628951"}],
  linux:[{n:"v2ray-core",d:"GitHub",u:"https://github.com/v2fly/v2ray-core/releases"},
         {n:"Clash",d:"GitHub",u:"https://github.com/Dreamacro/clash/releases"}],
};
const SUPPORT_URL = "https://t.me/tpoutline";

const FULFILL_LABEL = { new:"Новый", processing:"В работе", shipped:"Отправлен", done:"Завершён" };
const FULFILL_NEXT = { new:"processing", processing:"shipped", shipped:"done", done:"done" };

function detectOS(){
  const p = (navigator.userAgent || "").toLowerCase();
  if(/android/.test(p)) return "android";
  if(/iphone|ipad|ipod/.test(p)) return "ios";
  if(/mac os x|macintosh/.test(p)) return "macos";
  if(/linux/.test(p)) return "linux";
  return "windows";
}
const MY_OS = detectOS();

const STATE = {
  user:null, isAdmin:false, tab:"shop", screen:"catalog",
  cat:"all", products:[], paymentMethods:[{id:"yookassa",label:"Карта"}],
  product:null,
  buy:{ os:MY_OS, promo:null, promoPct:0, method:"yookassa", qty:1, shipping:{} },
  pay:null, result:null,
  adminEdit:null,
  installOS:MY_OS,
  cabinet:null,          // кэш ответа кабинета — нужен и для счётчика подписки
};
const STORE = !!(window.zvon && window.zvon.store);

// ---------- helpers ----------
const $ = (s,r=document)=>r.querySelector(s);
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove("on"),3200); }
function copy(t){
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast("Скопировано")).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Скопировано"); }catch(e){ toast("Не удалось скопировать"); }
  document.body.removeChild(ta);
}
function openUrl(u){ try{ window.open(u,"_blank","noopener"); }catch(e){ location.href=u; } }
function fmtDate(ts){ if(!ts) return "—"; const d=new Date(ts); return d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}); }
function fmtDay(ts){ if(!ts) return "—"; return new Date(ts).toLocaleDateString("ru-RU",{day:"2-digit",month:"short"}); }
function qrUrl(d){ return "https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=0&data="+encodeURIComponent(d); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(n){ return (n===0?"Бесплатно":n+" ₽"); }
// Склонение дней — счётчик подписки показывает их крупно, «5 дней»/«1 день».
function plural(n, one, few, many){
  const a=Math.abs(n)%100, b=a%10;
  if(a>10&&a<20) return many; if(b>1&&b<5) return few; if(b===1) return one; return many;
}
function days(n){ return n+" "+plural(n,"день","дня","дней"); }
async function S(p){ const d=await p; if(!d) throw new Error("Пустой ответ"); if(d.ok===false) throw new Error(d.error||"Ошибка"); return d; }

/* Лучшая цена за день среди платных VPN-тарифов — отмечаем значком «Выгодно»,
 * как в оригинальном магазине отмечался самый выгодный пакет трафика. */
function bestVpnId(list){
  const paid = list.filter(p=>p.type==="vpn" && p.price>0 && (p.vpn?.days||0)>0);
  if(paid.length<2) return null;
  return paid.reduce((a,b)=> (b.price/b.vpn.days < a.price/a.vpn.days ? b : a), paid[0]).id;
}

// ---------- bootstrap ----------
async function boot(){
  try { if(window.zvon){ const info=await zvon.init().catch(()=>null); STATE.user=(info&&info.user)||await zvon.getUser().catch(()=>null); } } catch(e){}
  if(!STATE.user) STATE.user={ _id:"guest", username:"Гость", avatar:null };
  if(STORE){
    try {
      const cat=await S(zvon.store.catalog());
      STATE.products=cat.products||[];
      STATE.isAdmin=!!cat.isAdmin;
      if(Array.isArray(cat.paymentMethods)&&cat.paymentMethods.length) STATE.paymentMethods=cat.paymentMethods;
      STATE.buy.method=(STATE.paymentMethods[0]||{}).id||"yookassa";
    } catch(e){}
  } else {
    STATE.products=[
      { id:"demo0", type:"vpn", title:"Пробный доступ", description:"Демо", price:0, images:[], vpn:{days:1,trialOnce:true} },
      { id:"demo1", type:"vpn", title:"VPN — 1 месяц", description:"Демо", price:189, images:[], vpn:{days:30} },
      { id:"demo2", type:"vpn", title:"VPN — 3 месяца", description:"Демо", price:449, images:[], vpn:{days:90} },
      { id:"demo3", type:"merch", title:"Футболка Zvon", description:"Демо-мерч", price:1490, images:[], merch:{options:["S","M","L"],requiresShipping:true} },
    ];
  }
  $("#loading").classList.add("hidden");
  $("#head").classList.remove("hidden");
  $("#content").classList.remove("hidden");
  $("#tabbar").classList.remove("hidden");
  renderWho(); renderTabs(); render();
}

function renderWho(){
  const u=STATE.user;
  const av=u.avatar?`<img src="${esc(u.avatar)}" alt="">`:`<div class="ava">${(u.username||'?')[0].toUpperCase()}</div>`;
  $("#who").innerHTML = av+`<span>${esc(u.username||'Гость')}</span>`;
}

function renderTabs(){
  const tabs=[["shop","▣","Магазин"],["cabinet","✦","Кабинет"],["install","⌁","Подключение"]];
  if(STATE.isAdmin) tabs.push(["admin","⚙","Админка"]);
  const bar=$("#tabbar"); bar.innerHTML="";
  tabs.forEach(([id,ic,label])=>{
    const b=el(`<button class="${STATE.tab===id?'on':''}"><span class="ic">${ic}</span>${label}</button>`);
    b.onclick=()=>go(id);
    bar.appendChild(b);
  });
}
function go(tab, screen){
  STATE.tab=tab; STATE.screen=screen||"catalog"; STATE.adminEdit=null;
  renderTabs(); render();
}

function render(){
  const c=$("#content"); c.innerHTML="";
  const wrap=el(`<div class="screen"></div>`); c.appendChild(wrap);
  if(STATE.tab==="shop"){
    if(STATE.screen==="catalog") renderCatalog(wrap);
    else if(STATE.screen==="product") renderProduct(wrap);
    else if(STATE.screen==="pay") renderPay(wrap);
    else if(STATE.screen==="result") renderResult(wrap);
  }
  else if(STATE.tab==="cabinet") renderCabinet(wrap);
  else if(STATE.tab==="install") renderInstall(wrap);
  else if(STATE.tab==="admin") renderAdmin(wrap);
  if(STATE.tab!=="admin") wrap.appendChild(footerLinks());
  window.scrollTo(0,0);
}

function footerLinks(){
  const f=el(`<div class="footer-links"></div>`);
  const sup=el(`<a>Поддержка</a>`); sup.onclick=()=>openUrl(SUPPORT_URL);
  const inst=el(`<a>Как подключить</a>`); inst.onclick=()=>go("install");
  f.append(sup, inst);
  return f;
}

// ---------- CATALOG ----------
function productImg(p){
  if(p.images && p.images[0]) return `<div class="imgwrap"><img src="${esc(p.images[0])}" alt=""></div>`;
  return `<div class="imgwrap placeholder">${p.type==='vpn'?'VPN':'Мерч'}</div>`;
}
function renderCatalog(c){
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Каталог</div>`));
  c.appendChild(el(`<h1>Витрина</h1>`));
  c.appendChild(el(`<div class="sub">VPN-доступ и мерч. Ключ выдаётся сразу после оплаты — ссылка постоянная, настраивать клиент нужно один раз.</div>`));

  const types=new Set(STATE.products.map(p=>p.type));
  const cats=[["all","Все"]];
  if(types.has("vpn")) cats.push(["vpn","VPN"]);
  if(types.has("merch")) cats.push(["merch","Мерч"]);
  if(cats.length>1){
    const chips=el(`<div class="chips"></div>`);
    cats.forEach(([id,label])=>{ const b=el(`<button class="chip ${STATE.cat===id?'active':''}">${label}</button>`); b.onclick=()=>{ STATE.cat=id; render(); }; chips.appendChild(b); });
    c.appendChild(chips);
  }

  const list=STATE.products.filter(p=>STATE.cat==="all"||p.type===STATE.cat);
  if(!list.length){ c.appendChild(el(`<div class="card"><div class="empty">Товаров пока нет.</div></div>`)); return; }
  const best=bestVpnId(list);
  const grid=el(`<div class="grid"></div>`);
  list.forEach(p=>{
    const d=p.vpn?.days||0;
    const perDay = (p.type==="vpn" && p.price>0 && d>0) ? `<div class="perday">${Math.round(p.price/d)} ₽/день · ${days(d)}</div>` : "";
    const label = p.type==='vpn' ? (p.vpn?.trialOnce?'Пробный':(p.vpn?.whitelist?'Whitelist':'VPN')) : 'Мерч';
    const card=el(`<div class="pcard ${p.id===best?'best':''}">
      ${p.id===best?'<span class="mark">Выгодно</span>':''}
      ${productImg(p)}
      <div class="pbody">
        <div class="ptitle">${esc(p.title)}</div>
        ${perDay}
        <div class="pbottom"><span class="pprice">${money(p.price)}</span><span class="tag">${label}</span></div>
      </div>
    </div>`);
    card.onclick=()=>openProduct(p);
    grid.appendChild(card);
  });
  c.appendChild(grid);

  /* Блок преимуществ — перенесён из оригинального магазина. */
  c.appendChild(el(`<div class="card" style="margin-top:18px">
    <h2>Почему это удобно</h2>
    <ul class="why">
      <li><b>Ссылка постоянная.</b> Настроили клиент один раз — при продлении ничего менять не нужно.</li>
      <li><b>Выдача мгновенная.</b> Ключ и QR появляются сразу после подтверждения оплаты.</li>
      <li><b>Оплата картой или криптой.</b> Способ выбирается на странице товара.</li>
      <li><b>Все покупки в кабинете.</b> Ключи, сроки и статусы заказов мерча — в одном месте.</li>
    </ul>
  </div>`));

  if(!STORE) c.appendChild(el(`<div class="demo-note">Демо-режим (вне Zvon): оплата и выдача недоступны.</div>`));
}

function openProduct(p){
  STATE.product=p;
  STATE.buy={ os:MY_OS, promo:null, promoPct:0, method:(STATE.paymentMethods[0]||{}).id||"yookassa", qty:1, shipping:{}, option:(p.merch?.options||[])[0]||"" };
  STATE.screen="product"; render();
}

// ---------- PRODUCT DETAIL ----------
function renderProduct(c){
  const p=STATE.product;
  const back=el(`<button class="back">← Каталог</button>`); back.onclick=()=>{ STATE.screen="catalog"; render(); }; c.appendChild(back);

  const media=el(`<div></div>`);
  if(p.images && p.images.length){
    media.appendChild(el(`<img class="hero-img" src="${esc(p.images[0])}" alt="">`));
    if(p.images.length>1){
      const row=el(`<div class="thumbs"></div>`);
      p.images.forEach(u=>{ const t=el(`<div class="thumb"><img src="${esc(u)}"></div>`); t.onclick=()=>{ media.firstChild.src=u; }; row.appendChild(t); });
      media.appendChild(row);
    }
  } else {
    media.appendChild(el(`<div class="hero-img placeholder">${p.type==='vpn'?'VPN':'Мерч'}</div>`));
  }
  c.appendChild(media);

  c.appendChild(el(`<div class="eyebrow" style="margin-top:18px">${p.type==='vpn'?'Подписка':'Товар'}</div>`));
  c.appendChild(el(`<h1>${esc(p.title)}</h1>`));
  const d=p.vpn?.days||0;
  if(p.type==="vpn" && d>0){
    c.appendChild(el(`<div class="muted" style="margin-top:6px">Срок доступа — ${days(d)}${p.price>0?` · ${Math.round(p.price/d)} ₽ в день`:""}${p.vpn?.trialOnce?" · доступен один раз":""}</div>`));
  }
  if(p.description) c.appendChild(el(`<div class="muted" style="white-space:pre-wrap;margin-top:10px">${esc(p.description)}</div>`));

  if(p.type==="vpn") renderVpnBuy(c, p); else renderMerchBuy(c, p);
}

function promoBlock(box, p){
  if(p.price<=0) return;
  box.appendChild(el(`<label>Промокод</label>`));
  const wrap=el(`<div class="row" style="margin-top:8px"></div>`);
  const inp=el(`<input placeholder="WELCOME" value="${esc(STATE.buy.promo||'')}" autocomplete="off" spellcheck="false" style="margin-top:0;letter-spacing:.1em;text-transform:uppercase">`);
  const ok=el(`<button class="btn ghost auto">OK</button>`);
  ok.onclick=async ()=>{
    const code=(inp.value||"").trim().toUpperCase();
    if(!code){ STATE.buy.promo=null; STATE.buy.promoPct=0; render(); return; }
    if(STORE){
      try{ const r=await S(zvon.store.promoCheck(code,p.id)); STATE.buy.promo=code; STATE.buy.promoPct=r.discountPercent||0; toast("Промокод применён: −"+r.discountPercent+"%"); }
      catch(e){ STATE.buy.promo=null; STATE.buy.promoPct=0; toast(e.message); }
    } else toast("Промокоды доступны внутри Zvon");
    render();
  };
  wrap.append(inp, ok); box.appendChild(wrap);
}
function paymentBlock(box){
  if(STATE.paymentMethods.length<=1) return;
  box.appendChild(el(`<label>Способ оплаты</label>`));
  const pm=el(`<div class="seg" style="grid-template-columns:1fr 1fr"></div>`);
  STATE.paymentMethods.forEach(m=>{ const b=el(`<button class="${STATE.buy.method===m.id?'active':''}">${esc(m.label)}</button>`); b.onclick=()=>{ STATE.buy.method=m.id; render(); }; pm.appendChild(b); });
  box.appendChild(pm);
}
function unitPrice(p){ return Math.max(0, p.price-Math.floor(p.price*STATE.buy.promoPct/100)); }
function finalPrice(p){ return p.type==="merch" ? unitPrice(p)*STATE.buy.qty : unitPrice(p); }

function totalBlock(box, p){
  const fp=finalPrice(p);
  const base=p.type==="merch" ? p.price*STATE.buy.qty : p.price;
  const t=el(`<div class="total"><span>К оплате</span><b></b></div>`);
  if(STATE.buy.promoPct>0 && base>0) t.querySelector("b").innerHTML=`<s>${base} ₽</s>${fp} ₽`;
  else t.querySelector("b").textContent = fp===0 ? "Бесплатно" : fp+" ₽";
  box.appendChild(t);
}

function renderVpnBuy(c, p){
  const box=el(`<div class="card" style="margin-top:16px"></div>`);
  box.appendChild(el(`<h2>Оформление</h2>`));
  box.appendChild(el(`<label style="margin-top:0">Операционная система</label>`));
  const seg=el(`<div class="seg"></div>`);
  OS_LIST.forEach(([id,label])=>{ const b=el(`<button class="${STATE.buy.os===id?'active':''}">${label}</button>`); b.onclick=()=>{ STATE.buy.os=id; render(); }; seg.appendChild(b); });
  box.appendChild(seg);
  box.appendChild(el(`<div class="muted" style="margin-top:8px;font-size:12px">Инструкция под выбранную систему придёт вместе с ключом.</div>`));
  paymentBlock(box);
  promoBlock(box, p);
  totalBlock(box, p);
  c.appendChild(box);

  const fp=finalPrice(p);
  const btn=el(`<button class="btn">${fp===0?'Получить доступ':('Оплатить '+fp+' ₽')}</button>`);
  btn.onclick=()=>checkout(btn,p);
  c.appendChild(btn);
  const how=el(`<button class="btn ghost">Как подключить</button>`); how.onclick=()=>go("install"); c.appendChild(how);
}

function renderMerchBuy(c, p){
  const box=el(`<div class="card" style="margin-top:16px"></div>`);
  box.appendChild(el(`<h2>Оформление</h2>`));
  const opts=p.merch?.options||[];
  if(opts.length){
    box.appendChild(el(`<label style="margin-top:0">Вариант</label>`));
    const seg=el(`<div class="seg"></div>`);
    opts.forEach(o=>{ const b=el(`<button class="${STATE.buy.option===o?'active':''}">${esc(o)}</button>`); b.onclick=()=>{ STATE.buy.option=o; render(); }; seg.appendChild(b); });
    box.appendChild(seg);
  }
  if(typeof p.merch?.stock === "number"){
    box.appendChild(el(`<div class="muted" style="margin-top:10px;font-size:12px">На складе: ${p.merch.stock} шт.</div>`));
  }
  box.appendChild(el(`<label>Количество</label>`));
  const qty=el(`<div class="qty"></div>`);
  const minus=el(`<button>−</button>`); minus.onclick=()=>{ STATE.buy.qty=Math.max(1,STATE.buy.qty-1); render(); };
  const plus=el(`<button>+</button>`); plus.onclick=()=>{ STATE.buy.qty++; render(); };
  qty.append(minus, el(`<span>${STATE.buy.qty}</span>`), plus); box.appendChild(qty);

  if(p.merch?.requiresShipping!==false){
    box.appendChild(el(`<label>Получатель</label>`));
    const name=el(`<input placeholder="Имя и фамилия" value="${esc(STATE.buy.shipping.name||'')}">`); name.oninput=e=>STATE.buy.shipping.name=e.target.value;
    const phone=el(`<input placeholder="Телефон" inputmode="tel" value="${esc(STATE.buy.shipping.phone||'')}" style="margin-top:8px">`); phone.oninput=e=>STATE.buy.shipping.phone=e.target.value;
    const addr=el(`<textarea placeholder="Адрес доставки (город, улица, индекс)" style="margin-top:8px">${esc(STATE.buy.shipping.address||'')}</textarea>`); addr.oninput=e=>STATE.buy.shipping.address=e.target.value;
    const com=el(`<input placeholder="Комментарий (необязательно)" value="${esc(STATE.buy.shipping.comment||'')}" style="margin-top:8px">`); com.oninput=e=>STATE.buy.shipping.comment=e.target.value;
    box.append(name, phone, addr, com);
  }
  paymentBlock(box);
  promoBlock(box, p);
  totalBlock(box, p);
  c.appendChild(box);

  const btn=el(`<button class="btn">Оплатить ${finalPrice(p)} ₽</button>`);
  btn.onclick=()=>checkout(btn,p);
  c.appendChild(btn);
}

async function checkout(btn, p){
  if(!STORE){ toast("Доступно только внутри Zvon"); return; }
  btn.disabled=true; const orig=btn.textContent; btn.textContent="Оформляем…";
  try {
    const body={ productId:p.id, os:STATE.buy.os, promo:STATE.buy.promo, paymentMethod:STATE.buy.method, qty:STATE.buy.qty };
    if(p.type==="merch") body.shipping={ ...STATE.buy.shipping, option:STATE.buy.option||"" };
    const data=await S(zvon.store.order(body));
    STATE.cabinet=null; // покупка меняет кабинет — сбрасываем кэш
    if(data.status==="pending" && data.payUrl){ STATE.pay={ ...data, product:p }; STATE.screen="pay"; render(); return; }
    STATE.result=orderResult(p, data); STATE.screen="result"; render();
  } catch(e){ toast(e.message); btn.disabled=false; btn.textContent=orig; }
}
function orderResult(p, data){
  return { type:p.type, title:p.title, subUrl:data.subUrl||null, expiryMs:data.expiryMs, instructions:data.instructions||OS_INSTRUCTIONS[STATE.buy.os] };
}

// ---------- PAY ----------
function renderPay(c){
  const d=STATE.pay;
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Оплата</div>`));
  c.appendChild(el(`<h1>${d.amount} ₽</h1>`));
  if(d.amountUsd) c.appendChild(el(`<div class="muted" style="margin-top:4px">≈ ${d.amountUsd} USDT</div>`));
  c.appendChild(el(`<div class="sub">${esc(d.product.title)}</div>`));

  const pay=el(`<button class="btn">Перейти к оплате</button>`); pay.onclick=()=>openUrl(d.payUrl); c.appendChild(pay);

  const zone=el(`<div></div>`);
  zone.appendChild(el(`<div class="warn">Оплатили? Вернитесь сюда и нажмите кнопку ниже — доступ выдастся сразу.</div>`));
  const check=el(`<button class="btn ghost">Я оплатил — проверить</button>`);
  check.onclick=async ()=>{
    check.disabled=true; check.textContent="Проверяем…";
    try {
      const res=await S(zvon.store.orderCheck(d.orderId));
      if(res.status==="paid"){ STATE.cabinet=null; STATE.result=orderResult(d.product,res); STATE.screen="result"; render(); return; }
      if(res.status==="pending") toast("Платёж ещё не подтверждён. Подождите минуту.");
      else if(res.status==="canceled") toast("Платёж отменён. Оформите заказ заново.");
      else toast("Статус: "+res.status);
    } catch(e){ toast(e.message); }
    check.disabled=false; check.textContent="Я оплатил — проверить";
  };
  zone.appendChild(check);
  c.appendChild(zone);

  const back=el(`<button class="btn dim">← В каталог</button>`); back.onclick=()=>{ STATE.screen="catalog"; render(); }; c.appendChild(back);
}

// ---------- RESULT ----------
function keyCard(subUrl, note){
  const card=el(`<div class="card hi"></div>`);
  card.appendChild(el(`<h2>Ваш ключ</h2>`));
  if(note) card.appendChild(el(`<p class="muted" style="margin:0 0 4px">${note}</p>`));
  card.appendChild(el(`<div class="qr"><img src="${qrUrl(subUrl)}" alt="QR"></div>`));
  card.appendChild(el(`<div class="code-box">${esc(subUrl)}</div>`));
  const cp=el(`<button class="btn">Скопировать ссылку</button>`); cp.onclick=()=>copy(subUrl); card.appendChild(cp);
  const how=el(`<button class="btn ghost">Как подключить</button>`); how.onclick=()=>go("install"); card.appendChild(how);
  return card;
}

function renderResult(c){
  const r=STATE.result;
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Готово</div>`));
  if(r.type==="vpn"){
    c.appendChild(el(`<h1>Подписка активна</h1>`));
    c.appendChild(el(`<div class="sub">${esc(r.title)}${r.expiryMs?` · до ${fmtDay(r.expiryMs)}`:""}</div>`));
    if(r.subUrl) c.appendChild(keyCard(r.subUrl, "Ссылка постоянная — она не меняется при продлении. Настройте клиент один раз."));
    if(r.instructions) c.appendChild(el(`<div class="card"><h2>Инструкция</h2><pre class="instr">${esc(r.instructions)}</pre></div>`));
  } else {
    c.appendChild(el(`<h1>Заказ оформлен</h1>`));
    c.appendChild(el(`<div class="sub">${esc(r.title)}</div>`));
    c.appendChild(el(`<div class="card"><p class="muted" style="margin:0">Мы получили заказ и свяжемся по доставке. Статус — во вкладке «Кабинет».</p></div>`));
  }
  const ok=el(`<button class="btn">${r.type==='vpn'?'В кабинет':'Мои заказы'}</button>`); ok.onclick=()=>go("cabinet"); c.appendChild(ok);
  const more=el(`<button class="btn ghost">Продолжить покупки</button>`); more.onclick=()=>go("shop"); c.appendChild(more);
}

// ---------- CABINET ----------
/* Счётчик подписки — аналог счётчика трафика оригинального магазина: крупная
 * цифра остатка, полосатая шкала израсходованного срока и сводка. */
function subMeter(subs){
  const now=Date.now();
  const active=subs.filter(s=>s.expiryMs && s.expiryMs>now).sort((a,b)=>b.expiryMs-a.expiryMs);
  const box=el(`<div class="card hi"></div>`);
  box.appendChild(el(`<h2>Ваш доступ</h2>`));

  if(!active.length){
    box.appendChild(el(`<div class="meter-top"><div class="meter-big">0<small>активных подписок</small></div></div>`));
    box.appendChild(el(`<div class="bar full"><i style="width:100%"></i></div>`));
    box.appendChild(el(`<div class="warn"><b>Подписка не активна.</b> Оформите тариф в каталоге — ключ выдастся сразу.</div>`));
    const b=el(`<button class="btn">В каталог</button>`); b.onclick=()=>go("shop"); box.appendChild(b);
    return box;
  }

  const s=active[0];
  const left=Math.max(1, Math.ceil((s.expiryMs-now)/86400000));
  const start=s.createdAt||(s.expiryMs-left*86400000);
  const total=Math.max(1, Math.round((s.expiryMs-start)/86400000));
  const pct=Math.min(100, Math.max(0, Math.round((total-left)/total*100)));

  box.appendChild(el(`<div class="meter-top">
    <div class="meter-big">${left}<small>${plural(left,"день","дня","дней")} до ${fmtDay(s.expiryMs)}</small></div>
    <div class="meter-right">${pct}%<br>срока прошло</div>
  </div>`));
  box.appendChild(el(`<div class="bar"><i style="width:${pct}%"></i></div>`));
  box.appendChild(el(`<div class="bar-legend"><span>${esc(s.title)}</span><span>всего ${days(total)}</span></div>`));
  box.appendChild(el(`<div class="stat-row">
    <div class="stat"><b>${active.length}</b><span>Активных подписок</span></div>
    <div class="stat"><b>${fmtDay(s.expiryMs)}</b><span>Действует до</span></div>
  </div>`));
  if(left<=3) box.appendChild(el(`<div class="warn"><b>Срок заканчивается.</b> Продлите доступ, чтобы не потерять подключение — ссылка останется прежней.</div>`));
  const b=el(`<button class="btn ${left<=3?'':'ghost'}">Продлить доступ</button>`); b.onclick=()=>go("shop"); box.appendChild(b);
  return box;
}

async function renderCabinet(c){
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Личный кабинет</div>`));
  c.appendChild(el(`<h1>Мои покупки</h1>`));
  if(!STORE){ c.appendChild(el(`<div class="card"><div class="empty">Доступно внутри Zvon.</div></div>`)); return; }

  const holder=el(`<div><div class="spinner"></div></div>`); c.appendChild(holder);
  try {
    const r = STATE.cabinet || await S(zvon.store.cabinet());
    STATE.cabinet = r;
    holder.innerHTML="";
    const subs=r.subscriptions||[], merch=r.merch||[];

    holder.appendChild(subMeter(subs));

    /* Ключ активной подписки — сразу на виду, как экран «Подписка» в оригинале. */
    const live=subs.filter(s=>s.expiryMs && s.expiryMs>Date.now() && s.subUrl).sort((a,b)=>b.expiryMs-a.expiryMs)[0];
    if(live) holder.appendChild(keyCard(live.subUrl, "Ссылка постоянная — она не меняется при продлении."));

    if(subs.length){
      holder.appendChild(el(`<h2>История подписок</h2>`));
      subs.forEach(s=>{
        const active=s.expiryMs && s.expiryMs>Date.now();
        const left=active?Math.max(1,Math.ceil((s.expiryMs-Date.now())/86400000)):0;
        const card=el(`<div class="card">
          <div class="flex-between"><div class="ptitle">${esc(s.title)}</div><span class="pill ${active?'active':'exp'}">${active?days(left):'истекла'}</span></div>
          <div class="muted" style="font-size:12.5px;margin-top:8px">${fmtDate(s.createdAt)} → ${s.expiryMs?fmtDate(s.expiryMs):'—'}</div>
        </div>`);
        if(s.subUrl && (!live || live.orderId!==s.orderId)){
          const b=el(`<button class="btn dim small">Ключ и QR</button>`);
          b.onclick=()=>{
            if(card.querySelector(".qr")) return;
            card.appendChild(el(`<div class="qr"><img src="${qrUrl(s.subUrl)}" alt="QR"></div>`));
            card.appendChild(el(`<div class="code-box">${esc(s.subUrl)}</div>`));
            const cp=el(`<button class="btn small">Скопировать</button>`); cp.onclick=()=>copy(s.subUrl); card.appendChild(cp);
          };
          card.appendChild(b);
        }
        holder.appendChild(card);
      });
    }

    if(merch.length){
      holder.appendChild(el(`<h2>Заказы мерча</h2>`));
      merch.forEach(m=>{
        holder.appendChild(el(`<div class="card">
          <div class="flex-between"><div class="ptitle">${esc(m.title)} ×${m.qty}</div><span class="pill ${m.fulfillment}">${FULFILL_LABEL[m.fulfillment]||m.fulfillment}</span></div>
          <div class="muted" style="font-size:12.5px;margin-top:8px">${fmtDate(m.createdAt)} · ${m.amount} ₽</div>
          ${m.shipping&&m.shipping.address?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(m.shipping.address)}${m.shipping.option?(' · '+esc(m.shipping.option)):''}</div>`:''}
        </div>`));
      });
    }

    if(!subs.length && !merch.length) holder.appendChild(el(`<div class="card"><div class="empty">Пока нет покупок.</div></div>`));
  } catch(e){
    holder.innerHTML="";
    holder.appendChild(el(`<div class="card"><div class="empty">${esc(e.message)}</div></div>`));
  }
}

// ---------- INSTALL ----------
/* Вкладка подключения — перенесена из оригинального VPN-магазина:
 * выбор системы, ссылки на клиенты и пронумерованные шаги. */
function renderInstall(c){
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Подключение</div>`));
  c.appendChild(el(`<h1>Установка</h1>`));
  c.appendChild(el(`<div class="sub">Выберите систему — покажем подходящий клиент и порядок действий. Настройка нужна один раз: ссылка подписки не меняется.</div>`));

  const box=el(`<div class="card"></div>`);
  const tabs=el(`<div class="chips" style="margin-top:0"></div>`);
  OS_LIST.forEach(([id,label])=>{
    const b=el(`<button class="chip ${STATE.installOS===id?'active':''}">${label}</button>`);
    b.onclick=()=>{ STATE.installOS=id; render(); };
    tabs.appendChild(b);
  });
  box.appendChild(tabs);

  (APPS[STATE.installOS]||[]).forEach(a=>{
    const link=el(`<div class="applink"><div><b>${esc(a.n)}</b><br><span>${esc(a.d)}</span></div><span class="go">↗</span></div>`);
    link.onclick=()=>openUrl(a.u);
    box.appendChild(link);
  });

  box.appendChild(el(`<ol class="steps">
    <li>Установите приложение для ${esc(OS_NAMES[STATE.installOS])}.</li>
    <li>Скопируйте ссылку подписки во вкладке «Кабинет».</li>
    <li>В приложении выберите «Добавить подписку» или «Импорт из буфера обмена».</li>
    <li>Обновите подписку и подключайтесь.</li>
  </ol>`));
  c.appendChild(box);

  const key=el(`<button class="btn">Открыть мой ключ</button>`); key.onclick=()=>go("cabinet"); c.appendChild(key);
  const shop=el(`<button class="btn ghost">В каталог</button>`); shop.onclick=()=>go("shop"); c.appendChild(shop);
  const sup=el(`<button class="btn dim">Написать в поддержку</button>`); sup.onclick=()=>openUrl(SUPPORT_URL); c.appendChild(sup);
}

// ---------- ADMIN ----------
async function renderAdmin(c){
  c.appendChild(el(`<div class="eyebrow" style="margin-top:16px">Управление</div>`));
  c.appendChild(el(`<h1>Админка</h1>`));
  if(STATE.adminEdit!==null){ renderProductForm(c, STATE.adminEdit); return; }

  const addBtn=el(`<button class="btn">+ Добавить товар</button>`);
  addBtn.onclick=()=>{ STATE.adminEdit={ type:"merch", title:"", description:"", price:0, images:[], active:true, sortOrder:0, vpn:{days:30,whitelist:false,trialOnce:false}, merch:{stock:"",requiresShipping:true,options:""} }; render(); };
  c.appendChild(addBtn);

  c.appendChild(el(`<h2>Товары</h2>`));
  const holder=el(`<div><div class="spinner"></div></div>`); c.appendChild(holder);
  try {
    const r=await S(zvon.store.admin.products());
    holder.innerHTML="";
    if(!(r.products||[]).length) holder.appendChild(el(`<div class="card"><div class="empty">Товаров нет.</div></div>`));
    (r.products||[]).forEach(p=>{
      const thumb = p.images&&p.images[0]
        ? `<img src="${esc(p.images[0])}" style="width:100%;height:100%;object-fit:cover">`
        : (p.type==='vpn'?'🛡':'👕');
      const item=el(`<div class="card"><div class="row" style="align-items:center;gap:14px">
        <div style="width:54px;height:54px;overflow:hidden;flex:none;background:#000;border:2px solid var(--line);display:grid;place-items:center;font-size:22px">${thumb}</div>
        <div style="flex:1;min-width:0">
          <div class="ptitle">${esc(p.title)} ${p.active?'':'<span class="pill exp">скрыт</span>'}</div>
          <div class="tag" style="margin-top:4px">${p.type} · ${money(p.price)}${p.type==='vpn'&&p.vpn?.days?(' · '+days(p.vpn.days)):''}</div>
        </div>
      </div></div>`);
      const row=el(`<div class="row" style="margin-top:12px"></div>`);
      const edit=el(`<button class="btn ghost small" style="flex:1;margin-top:0">Изменить</button>`); edit.onclick=()=>{ STATE.adminEdit=adminToForm(p); render(); };
      const del=el(`<button class="btn danger small" style="flex:1;margin-top:0">Удалить</button>`);
      del.onclick=async ()=>{ if(!confirm("Удалить товар?")) return; try{ await S(zvon.store.admin.remove(p.id)); toast("Удалено"); render(); }catch(e){ toast(e.message); } };
      row.append(edit, del); item.appendChild(row);
      holder.appendChild(item);
    });
  } catch(e){ holder.innerHTML=""; holder.appendChild(el(`<div class="card"><div class="empty">${esc(e.message)}</div></div>`)); }

  c.appendChild(el(`<h2>Заказы</h2>`));
  const oh=el(`<div><div class="spinner"></div></div>`); c.appendChild(oh);
  try {
    const r=await S(zvon.store.admin.orders());
    oh.innerHTML="";
    if(!(r.orders||[]).length) oh.appendChild(el(`<div class="card"><div class="empty">Заказов нет.</div></div>`));
    (r.orders||[]).forEach(o=>{
      const statusCls = o.status==='paid' ? 'active' : (o.status==='canceled' ? 'canceled' : 'new');
      const card=el(`<div class="card">
        <div class="flex-between"><div class="ptitle">${esc(o.title)} ${o.type==='merch'?('×'+o.qty):''}</div><span class="pill ${statusCls}">${esc(o.status)}</span></div>
        <div class="muted" style="font-size:12px;margin-top:8px">@${esc(o.username||'?')} · ${o.amount} ₽ · ${esc(o.provider||'')} · ${fmtDate(o.createdAt)}</div>
        ${o.type==='merch'&&o.shipping?`<div class="muted" style="font-size:12px;margin-top:8px">${esc(o.shipping.name||'')} · ${esc(o.shipping.phone||'')}<br>${esc(o.shipping.address||'')}${o.shipping.option?(' · '+esc(o.shipping.option)):''}${o.shipping.comment?('<br>'+esc(o.shipping.comment)):''}</div>`:''}
      </div>`);
      if(o.type==='merch' && o.status==='paid'){
        const fr=el(`<div class="flex-between" style="margin-top:12px"><span class="pill ${o.fulfillment}">${FULFILL_LABEL[o.fulfillment]||o.fulfillment}</span></div>`);
        if(o.fulfillment!=='done'){
          const nx=el(`<button class="btn ghost small auto">→ ${FULFILL_LABEL[FULFILL_NEXT[o.fulfillment]]}</button>`);
          nx.onclick=async ()=>{ try{ await S(zvon.store.admin.fulfill(o.orderId, FULFILL_NEXT[o.fulfillment])); toast("Обновлено"); render(); }catch(e){ toast(e.message); } };
          fr.appendChild(nx);
        }
        card.appendChild(fr);
      }
      oh.appendChild(card);
    });
  } catch(e){ oh.innerHTML=""; oh.appendChild(el(`<div class="card"><div class="empty">${esc(e.message)}</div></div>`)); }
}

function adminToForm(p){
  return { id:p.id, type:p.type, title:p.title, description:p.description||"", price:p.price, images:[...(p.images||[])], active:p.active!==false, sortOrder:p.sortOrder||0,
    vpn:{ days:p.vpn?.days||30, whitelist:!!p.vpn?.whitelist, trialOnce:!!p.vpn?.trialOnce },
    merch:{ stock:(p.merch&&p.merch.stock!=null)?p.merch.stock:"", requiresShipping:p.merch?p.merch.requiresShipping!==false:true, options:(p.merch?.options||[]).join(", ") } };
}

function renderProductForm(c, f){
  const back=el(`<button class="back">← К списку</button>`); back.onclick=()=>{ STATE.adminEdit=null; render(); }; c.appendChild(back);
  c.appendChild(el(`<h1>${f.id?'Изменить товар':'Новый товар'}</h1>`));
  const box=el(`<div class="card" style="margin-top:10px"></div>`);

  box.appendChild(el(`<label style="margin-top:0">Тип товара</label>`));
  const typeSeg=el(`<div class="seg" style="grid-template-columns:1fr 1fr"></div>`);
  [["vpn","🛡 VPN"],["merch","👕 Мерч"]].forEach(([id,label])=>{ const b=el(`<button class="${f.type===id?'active':''}">${label}</button>`); b.onclick=()=>{ f.type=id; STATE.adminEdit=f; render(); }; typeSeg.appendChild(b); });
  box.appendChild(typeSeg);

  const title=el(`<input placeholder="Название" value="${esc(f.title)}">`); title.oninput=e=>f.title=e.target.value;
  box.appendChild(el(`<label>Название</label>`)); box.appendChild(title);
  const desc=el(`<textarea placeholder="Описание">${esc(f.description)}</textarea>`); desc.oninput=e=>f.description=e.target.value;
  box.appendChild(el(`<label>Описание</label>`)); box.appendChild(desc);
  const price=el(`<input type="number" inputmode="numeric" value="${f.price}">`); price.oninput=e=>f.price=parseInt(e.target.value,10)||0;
  box.appendChild(el(`<label>Цена, ₽ (0 = бесплатно)</label>`)); box.appendChild(price);
  const sort=el(`<input type="number" inputmode="numeric" value="${f.sortOrder}">`); sort.oninput=e=>f.sortOrder=parseInt(e.target.value,10)||0;
  box.appendChild(el(`<label>Порядок сортировки</label>`)); box.appendChild(sort);

  box.appendChild(el(`<label>Картинки</label>`));
  const thumbs=el(`<div class="thumbs"></div>`);
  function redrawThumbs(){ thumbs.innerHTML=""; f.images.forEach((u,i)=>{ const t=el(`<div class="thumb"><img src="${esc(u)}"><button>✕</button></div>`); t.querySelector("button").onclick=()=>{ f.images.splice(i,1); redrawThumbs(); }; thumbs.appendChild(t); }); }
  redrawThumbs(); box.appendChild(thumbs);
  const imgRow=el(`<div class="row" style="margin-top:10px"></div>`);
  const urlInp=el(`<input placeholder="URL картинки" style="margin-top:0">`);
  const addUrl=el(`<button class="btn ghost auto">+ URL</button>`); addUrl.onclick=()=>{ const u=(urlInp.value||"").trim(); if(u){ f.images.push(u); urlInp.value=""; redrawThumbs(); } };
  imgRow.append(urlInp, addUrl); box.appendChild(imgRow);
  const fileInp=el(`<input type="file" accept="image/*" style="margin-top:10px">`);
  fileInp.onchange=async ()=>{ const file=fileInp.files[0]; if(!file) return; if(!STORE){ toast("Загрузка только внутри Zvon"); return; } const reader=new FileReader(); reader.onload=async ()=>{ try{ const r=await S(zvon.store.admin.upload(reader.result)); f.images.push(r.url); redrawThumbs(); toast("Картинка загружена"); }catch(e){ toast(e.message); } }; reader.readAsDataURL(file); fileInp.value=""; };
  box.appendChild(el(`<div class="muted" style="font-size:12px;margin-top:8px">или загрузите файл:</div>`)); box.appendChild(fileInp);

  if(f.type==="vpn"){
    const d=el(`<input type="number" inputmode="numeric" value="${f.vpn.days}">`); d.oninput=e=>f.vpn.days=parseInt(e.target.value,10)||1;
    box.appendChild(el(`<label>Дней доступа</label>`)); box.appendChild(d);
    const wl=el(`<label class="check"><input type="checkbox" ${f.vpn.whitelist?'checked':''}> Использовать whitelist-инбаунды</label>`); wl.querySelector("input").onchange=e=>f.vpn.whitelist=e.target.checked; box.appendChild(wl);
    const tr=el(`<label class="check"><input type="checkbox" ${f.vpn.trialOnce?'checked':''}> Пробный (один раз на пользователя)</label>`); tr.querySelector("input").onchange=e=>f.vpn.trialOnce=e.target.checked; box.appendChild(tr);
  } else {
    const stock=el(`<input placeholder="пусто = без ограничения" inputmode="numeric" value="${f.merch.stock}">`); stock.oninput=e=>f.merch.stock=e.target.value;
    box.appendChild(el(`<label>Остаток на складе</label>`)); box.appendChild(stock);
    const opts=el(`<input placeholder="через запятую: S, M, L" value="${esc(f.merch.options)}">`); opts.oninput=e=>f.merch.options=e.target.value;
    box.appendChild(el(`<label>Варианты (размеры и т.п.)</label>`)); box.appendChild(opts);
    const sh=el(`<label class="check"><input type="checkbox" ${f.merch.requiresShipping?'checked':''}> Требуется адрес доставки</label>`); sh.querySelector("input").onchange=e=>f.merch.requiresShipping=e.target.checked; box.appendChild(sh);
  }
  const act=el(`<label class="check"><input type="checkbox" ${f.active?'checked':''}> Показывать в каталоге</label>`); act.querySelector("input").onchange=e=>f.active=e.target.checked; box.appendChild(act);
  c.appendChild(box);

  const save=el(`<button class="btn">Сохранить</button>`);
  save.onclick=async ()=>{
    if(!f.title.trim()){ toast("Укажите название"); return; }
    save.disabled=true; save.textContent="Сохраняем…";
    const payload={ type:f.type, title:f.title, description:f.description, price:f.price, images:f.images, active:f.active, sortOrder:f.sortOrder,
      vpn:{ days:f.vpn.days, whitelist:f.vpn.whitelist, trialOnce:f.vpn.trialOnce },
      merch:{ stock:f.merch.stock===""?null:f.merch.stock, requiresShipping:f.merch.requiresShipping, options:f.merch.options } };
    try {
      if(f.id) await S(zvon.store.admin.update(f.id, payload)); else await S(zvon.store.admin.create(payload));
      toast("Сохранено"); STATE.adminEdit=null;
      const cat=await S(zvon.store.catalog()); STATE.products=cat.products||[]; render();
    } catch(e){ toast(e.message); save.disabled=false; save.textContent="Сохранить"; }
  };
  c.appendChild(save);
  if(f.id){
    const del=el(`<button class="btn danger">Удалить товар</button>`);
    del.onclick=async ()=>{ if(!confirm("Удалить товар?")) return; try{ await S(zvon.store.admin.remove(f.id)); toast("Удалено"); STATE.adminEdit=null; const cat=await S(zvon.store.catalog()); STATE.products=cat.products||[]; render(); }catch(e){ toast(e.message); } };
    c.appendChild(del);
  }
}

// старт
function safeBoot(){
  boot().catch(e=>{
    $("#loading").innerHTML =
      '<p style="font-family:Anton,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c8102e">Не удалось загрузить</p>'+
      '<p style="font-size:13px;color:#a9a5a0">'+esc(e.message||"Попробуйте открыть магазин заново")+'</p>';
  });
}
if(window.zvon) safeBoot();
else window.addEventListener("zvon-sdk-ready", safeBoot, { once:true });
setTimeout(()=>{ if($("#loading") && !$("#loading").classList.contains("hidden")) safeBoot(); }, 1500);
</script>
